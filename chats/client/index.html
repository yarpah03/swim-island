<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09151b">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Кабинет ученика · Плавательный остров VIP</title>
  <link rel="icon" href="/client/vip-icon.png">
  <link rel="apple-touch-icon" href="/client/vip-icon.png">
  <link rel="manifest" href="/client/manifest.webmanifest">
  <link rel="stylesheet" href="/client/chat.css?v=6">
  <link rel="stylesheet" href="/client/client.css?v=5">
</head>
<body class="web-client">
  <main class="client-login">
    <div class="client-brand">
      <img src="/client/vip-icon.png" width="54" height="54" alt="">
      <span>Плавательный остров <b>VIP</b></span>
    </div>
    <section class="client-card" aria-labelledby="client-title">
      <h1 id="client-title">Кабинет ученика</h1>
      <p id="client-help">Проверяем вход…</p>
      <form class="chat-form" id="client-password-form" hidden>
        <label class="chat-field" id="client-name-field">Имя в приложении
          <input id="client-name" type="text" maxlength="40" autocomplete="name">
        </label>
        <label class="chat-field">Логин
          <input id="client-login" type="text" autocapitalize="none" spellcheck="false" autocomplete="username" maxlength="32" required>
        </label>
        <label class="chat-field">Пароль
          <input id="client-password" type="password" autocomplete="current-password" maxlength="128" required>
        </label>
        <button class="chat-button chat-primary" id="client-login-button" type="submit">Войти</button>
      </form>
      <form class="chat-form" id="client-access" hidden>
        <label class="chat-field">Код из письма
          <input id="client-code" type="text" autocapitalize="characters" spellcheck="false" autocomplete="one-time-code" maxlength="22" required>
        </label>
        <button class="chat-button chat-primary" type="submit">Войти</button>
        <button class="chat-button" id="client-request" type="button" hidden>Получить код на почту</button>
      </form>
      <p class="chat-status" id="client-status" role="status"></p>
      <button class="chat-button chat-primary" id="client-invite-retry" type="button" hidden>Проверить ещё раз</button>
      <a class="client-login-link" id="client-login-link" href="/client/" hidden>Перейти ко входу</a>
    </section>
  </main>
  <main id="client-library" class="client-library" hidden>
    <iframe id="client-catalog" title="Плавательный остров VIP" inert
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
      referrerpolicy="no-referrer" allow="fullscreen" allowfullscreen></iframe>
    <div id="client-library-notice" class="client-library-notice" hidden>
      <p id="client-library-status" role="status"></p>
      <button class="chat-button" id="client-library-retry" type="button" hidden>Загрузить ещё раз</button>
    </div>
  </main>
  <main id="swim-chats" hidden></main>
  <main id="partner-browser" class="partner-area" hidden></main>
  <dialog id="client-account" class="chat-forward-sheet" aria-labelledby="client-account-title">
    <div class="chat-forward-heading">
      <h2 id="client-account-title">Личный кабинет</h2>
      <button class="chat-button" id="client-account-close" type="button">Закрыть</button>
    </div>
    <div class="client-install-body">
      <button class="chat-button" id="client-install-menu" type="button">Установить приложение</button>
      <button class="chat-button" id="client-logout" type="button">Выйти</button>
      <p class="chat-status" id="client-account-status" role="status"></p>
    </div>
  </dialog>
  <dialog id="client-install" class="chat-forward-sheet" aria-labelledby="client-install-title">
    <div class="chat-forward-heading"><h2 id="client-install-title">Установить приложение</h2><button class="chat-button" type="button">Закрыть</button></div>
    <div class="client-install-body">
      <p><strong>На iPhone</strong> откройте в Safari меню «Поделиться», затем «На экран “Домой”».</p>
      <p><strong>На Android</strong> откройте меню браузера и выберите «Установить приложение» или «Добавить на главный экран».</p>
    </div>
  </dialog>
  <script src="/client/chat.js?v=6" defer></script>
  <script src="/client/partners.js?v=3" defer></script>
  <script src="/client/client.js?v=5" defer></script>
</body>
</html>
