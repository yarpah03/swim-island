<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09151b">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Кабинет ученика · Плавательный остров VIP</title>
  <link rel="icon" href="/client/vip-icon.png">
  <link rel="apple-touch-icon" href="/client/vip-icon.png">
  <link rel="stylesheet" href="/client/chat.css?v=1">
  <link rel="stylesheet" href="/client/client.css?v=1">
</head>
<body class="web-client">
  <main class="client-login">
    <div class="client-brand">
      <img src="/client/vip-icon.png" width="54" height="54" alt="">
      <span>Плавательный остров <b>VIP</b></span>
    </div>
    <section class="client-card" aria-labelledby="client-title">
      <h1 id="client-title">Кабинет ученика</h1>
      <p id="client-help">Проверяем вход…</p>
      <form class="chat-form" id="client-access" hidden>
        <label class="chat-field">Код из письма
          <input id="client-code" type="text" autocapitalize="characters" spellcheck="false" autocomplete="one-time-code" maxlength="22" required>
        </label>
        <button class="chat-button chat-primary" type="submit">Войти</button>
        <button class="chat-button" id="client-request" type="button" hidden>Получить код на почту</button>
      </form>
      <p class="chat-status" id="client-status" role="status"></p>
    </section>
  </main>
  <main id="swim-chats" hidden></main>
  <script src="/client/chat.js?v=1" defer></script>
  <script src="/client/client.js?v=1" defer></script>
</body>
</html>
