<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плавательный остров ВИП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B98A2E;
  --gold-lt:#D0A445;
  --gold-dk:#7E5C1E;
  --gold-dim:rgba(185,138,46,.16);
  --gold-line:rgba(185,138,46,.30);
  --bg:#080807;
  --surf:#111110;
  --surf-2:#191817;
  --txt:#F2EFE8;
  --txt-2:#A8A296;
  --txt-3:#6E6A62;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;
  padding-bottom:64px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(8,8,7,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--gold-line);
}
.hd{display:flex;align-items:center;gap:14px;padding:16px 0}
.mark{width:42px;height:42px;flex:none}
.wordmark{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;letter-spacing:.10em;color:var(--gold);line-height:1.1}
.wordmark small{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.28em;color:var(--txt-3);margin-top:3px}
.hd-spacer{flex:1}
.acct{width:38px;height:38px;border:1px solid var(--gold-line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:13px;font-weight:500;flex:none}

.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:22px 0 6px;font-size:13px;color:var(--txt-3)}
.crumb a{color:var(--gold);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--gold-lt)}
.crumb span.sep{color:var(--txt-3)}

h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:600;letter-spacing:.01em;line-height:1.15;margin:6px 0 10px}
.lede{color:var(--txt-2);font-size:16px;max-width:660px;margin-bottom:30px}
h2{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:38px 0 16px}

.hero{position:relative;padding:0;border:0;margin:0 -20px 8px;overflow:hidden}
.hero-in{position:relative;padding:64px 20px 30px;z-index:2}
.hero-photo{
  position:absolute;inset:0;z-index:0;
  background-image:url('hero.jpg');
  background-size:cover;background-position:center 58%;
}
@media(max-width:700px){.hero-photo{background-image:url('hero-mobile.jpg')}}
.hero-veil{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(8,8,7,.30) 0%,rgba(8,8,7,.52) 44%,rgba(8,8,7,.88) 82%,#080807 100%);
}
.hero-waves{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:2;pointer-events:none}
.hero .mark-big{width:70px;height:70px;margin-bottom:18px;display:block}
.hero h1{font-size:46px;margin-bottom:12px}
.hero .lede{margin-bottom:24px}
.hero-note{font-size:11px;letter-spacing:.14em;color:var(--txt-3);margin-bottom:14px}
@media(max-width:600px){
  .hero{margin:0 -15px 8px}
  .hero-in{padding:42px 15px 22px}
  .hero h1{font-size:31px}
  .hero .mark-big{width:54px;height:54px}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

.card{
  background:var(--surf);border:1px solid rgba(185,138,46,.18);border-radius:var(--r);
  padding:20px 20px 18px;cursor:pointer;transition:border-color .18s,background .18s,transform .18s;
  display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;font:inherit;width:100%;
}
.card:hover{border-color:var(--gold);background:var(--surf-2);transform:translateY(-2px)}
.card .num{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;color:var(--gold-dk);letter-spacing:.06em}
.card .ttl{font-size:18px;font-weight:500;color:var(--txt);letter-spacing:.01em}
.card .sub{font-size:13.5px;color:var(--txt-2);line-height:1.5}
.card .meta{margin-top:6px;font-size:12px;color:var(--txt-3);letter-spacing:.04em}

.row{
  display:flex;align-items:center;gap:14px;
  background:var(--surf);border:1px solid rgba(185,138,46,.14);border-radius:10px;
  padding:15px 17px;cursor:pointer;transition:border-color .18s,background .18s;
  text-align:left;color:inherit;font:inherit;width:100%;
}
.row:hover{border-color:var(--gold-line);background:var(--surf-2)}
.row .idx{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:var(--gold);min-width:34px;letter-spacing:.04em}
.row .body{flex:1;min-width:0}
.row .name{font-size:15.5px;font-weight:500}
.row .note{font-size:13px;color:var(--txt-2);margin-top:2px}
.row .chev{color:var(--gold-dk);font-size:18px;line-height:1}
.rows{display:flex;flex-direction:column;gap:8px}

.pill{display:inline-block;font-size:11.5px;letter-spacing:.06em;color:var(--gold);background:var(--gold-dim);border-radius:20px;padding:4px 12px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}

.slot{
  border:1px dashed rgba(185,138,46,.34);border-radius:var(--r);
  padding:30px 22px;text-align:center;color:var(--txt-3);font-size:14px;background:rgba(185,138,46,.03)
}
.slot b{display:block;color:var(--gold);font-weight:500;font-size:15px;margin-bottom:6px;letter-spacing:.02em}

.err{background:var(--surf);border-left:3px solid #B0472F;border-radius:0;padding:14px 17px;font-size:14px;color:var(--txt-2);margin:16px 0}
.err b{color:#D2765C;font-weight:500}
.tipbox{background:var(--surf);border-left:3px solid var(--gold);border-radius:0;padding:14px 17px;font-size:14px;color:var(--txt-2);margin:16px 0}
.tipbox b{color:var(--gold);font-weight:500}

.lesson{max-width:760px}
.lesson .intro{background:var(--surf);border:1px solid rgba(185,138,46,.16);border-radius:var(--r);padding:20px 22px;margin-bottom:8px;color:var(--txt-2);font-size:15px;line-height:1.65}
.ex{margin:30px 0 0}
.ex-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.ex-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--gold-dk);line-height:1;min-width:34px}
.ex-t{font-size:21px;font-weight:500;letter-spacing:.01em;color:var(--txt)}
.goal,.hint{display:flex;gap:11px;padding:13px 16px;border-radius:10px;font-size:14.5px;line-height:1.6;margin-bottom:9px}
.goal{background:rgba(185,138,46,.07);border-left:3px solid var(--gold)}
.hint{background:var(--surf);border-left:3px solid var(--gold-dk)}
.goal i,.hint i{font-style:normal;color:var(--gold);flex:none;font-size:15px}
.goal b,.hint b{color:var(--gold);font-weight:500}
.goal span,.hint span{color:var(--txt-2)}
.vid{margin:14px 0 0;border-radius:10px;overflow:hidden;background:#000;border:1px solid rgba(185,138,46,.2)}
.vid video{width:100%;display:block;background:#000}
.vid-cap{padding:9px 14px;font-size:12.5px;color:var(--txt-3);letter-spacing:.03em;background:var(--surf)}
.vid{position:relative}
.vid .frame{position:relative;padding-top:56.25%;width:100%;background:#000}
.vid .frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.vid-ph{
  aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(185,138,46,.04);color:var(--txt-3);font-size:13px;text-align:center;padding:20px
}
.vid-ph b{color:var(--gold);font-weight:500;font-size:15px;letter-spacing:.02em}
.snd{
  position:absolute;right:10px;top:10px;z-index:3;
  display:flex;align-items:center;gap:7px;
  background:rgba(8,8,7,.72);backdrop-filter:blur(6px);
  border:1px solid rgba(185,138,46,.4);border-radius:20px;
  padding:6px 13px;font-size:12px;color:var(--gold);
  cursor:pointer;pointer-events:none;transition:opacity .25s;letter-spacing:.02em
}
.vid.on .snd{opacity:0}
.vid video{cursor:pointer}
/* Тренировки: карточка + золотой разделитель между ними */
.wks{max-width:780px}
.wk{
  background:var(--surf);border:1px solid rgba(185,138,46,.16);
  border-radius:var(--r);overflow:hidden
}
.wk-h{
  display:flex;align-items:center;gap:12px;
  padding:13px 20px;background:rgba(185,138,46,.07);
  border-bottom:1px solid rgba(185,138,46,.18)
}
.wk-n{
  font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);flex:1
}
.wk-v{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;
  color:var(--gold-lt);letter-spacing:.03em;flex:none
}
.wk-i{margin:0;padding:16px 20px 18px 20px;list-style:none;counter-reset:wkstep}
.wk-i li{
  counter-increment:wkstep;position:relative;
  padding:0 0 0 30px;margin-bottom:11px;
  font-size:14.5px;line-height:1.6;color:var(--txt-2)
}
.wk-i li:last-child{margin-bottom:0}
.wk-i li::before{
  content:counter(wkstep);position:absolute;left:0;top:1px;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;
  color:var(--gold-dk);line-height:1.5
}
.wk-sep{display:flex;align-items:center;gap:16px;margin:26px 0}
.wk-sep::before,.wk-sep::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(185,138,46,.42),transparent)
}
.wk-sep svg{width:20px;height:20px;flex:none;opacity:.6}
@media(max-width:600px){
  .wk-h{padding:12px 15px}
  .wk-i{padding:14px 15px 16px 15px}
  .wk-i li{padding-left:26px;font-size:14px}
}

.plan{margin-top:14px;border:1px solid rgba(185,138,46,.2);border-radius:var(--r);overflow:hidden}
.plan-r{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(185,138,46,.14);font-size:14.5px}
.plan-r:last-child{border-bottom:0}
.plan-r b{color:var(--gold);font-weight:500;flex:none;min-width:62px}
.plan-r span{color:var(--txt-2)}
@media(max-width:600px){.ex-n{font-size:24px;min-width:26px}.ex-t{font-size:18px}}
footer{border-top:1px solid rgba(185,138,46,.14);margin-top:56px;padding:22px 0 8px;color:var(--txt-3);font-size:12.5px;letter-spacing:.04em}

@media(max-width:600px){
  .wrap{padding:0 15px}
  h1{font-size:29px}
  .hero h1{font-size:32px}
  .hero{padding:26px 0 4px}
  .grid,.grid-2{grid-template-columns:1fr}
  .wordmark{font-size:19px}
  .mark{width:36px;height:36px}
}
</style>

/* Разворачиваем данные выносливости в экраны: уровень → пять блоков → пять тренировок.
   Восемнадцать экранов писать руками не нужно, они собираются отсюда. */
Object.keys(AERO).forEach(lvl=>{
  const L = AERO[lvl];
  T[lvl] = {
    title: "Выносливость. " + L.level,
    lede: "Пять блоков. Внутри каждого — пять готовых тренировок.",
    pills: [L.level, L.vol + " за занятие"],
    kids: L.blocks.map(b=>({
      id: lvl + "_" + b.n,
      n: "№ " + b.n,
      t: b.t,
      s: b.sub,
      m: b.w.length + " тренировок"
    }))
  };
  PARENT[lvl] = "b_vy";

  L.blocks.forEach(b=>{
    const id = lvl + "_" + b.n;
    T[id] = {
      title: "Блок № " + b.n + ". " + b.t,
      lede: b.sub,
      pills: [L.level, b.w.length + " тренировок"],
      workouts: b.w
    };
    PARENT[id] = lvl;
  });
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function crumbs(id){
  const chain=[];let cur=id;
  while(cur && cur!=="home"){chain.unshift(cur);cur=PARENT[cur];}
  let h='<a onclick="go(\'home\')">Главное</a>';
  chain.forEach((c,i)=>{
    h+=' <span class="sep">/</span> ';
    h+= i===chain.length-1 ? esc(T[c].title) : `<a onclick="go('${c}')">${esc(T[c].title)}</a>`;
  });
  return `<div class="crumb">${h}</div>`;
}

  const d = T[id]; if(!d) return;

  if(id==="home"){
    h += `<div class="hero">

        <div class="hero-note">ЗАКРЫТЫЙ КЛУБ ДЛЯ ПЛОВЦОВ</div>
        <h1>${esc(d.title)}</h1>
        <p class="lede">${esc(d.lede)}</p>
      </div>
    </div>`;
    h += `<h2>Разделы</h2><div class="grid">`;
    d.kids.forEach(k=>{
      h += `<button class="card" onclick="go('${k.id}')">

    h += `</div>`;
  } else {
    h += crumbs(id);
    h += `<h1>${esc(d.title)}</h1>`;
    if(d.lede) h += `<p class="lede">${esc(d.lede)}</p>`;
    if(d.pills) h += `<div class="pills">${d.pills.map(p=>`<span class="pill">${esc(p)}</span>`).join("")}</div>`;

    if(d.kids){
      h += `<div class="grid">`;
      d.kids.forEach(k=>{
        h += `<button class="card" onclick="go('${k.id}')">
          <span class="num">${esc(k.n)}</span>
          <span class="ttl">${esc(k.t)}</span>
          <span class="sub">${esc(k.s)}</span>
          ${k.m?`<span class="meta">${esc(k.m)}</span>`:""}
        </button>`;
      });
      h += `</div>`;
    }

if(d.lesson){
      const L=d.lesson;
      h += `<div class="lesson"><div class="intro">${esc(L.intro)}</div>`;
      L.ex.forEach(e=>{
        const kid = (KINESCOPE[e.v] || "").trim();
        const player = kid
          ? `<div class="frame"><iframe
                data-src="https://kinescope.io/embed/${encodeURIComponent(kid)}?autoplay=1&muted=1&loop=1&autopause=1&playsinline=1&title=0"
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media;"
                frameborder="0" allowfullscreen loading="lazy"></iframe></div>`
          : `<video muted loop playsinline preload="metadata" src="Баттерфляй с нуля — видео/${esc(e.v)}"></video>
             <div class="snd">&#9834; нажмите, чтобы включить звук</div>`;
        h += `<div class="ex">
          <div class="ex-h"><span class="ex-n">${e.n}</span><span class="ex-t">${esc(e.t)}</span></div>
          <div class="goal"><i>&#9673;</i><span><b>Цель.</b> ${esc(e.goal)}</span></div>
          <div class="hint"><i>&#10003;</i><span><b>Совет.</b> ${esc(e.hint)}</span></div>
          <div class="vid">
            ${player}
            <div class="vid-cap">Упражнение ${e.n} — показ</div>
          </div>
        </div>`;
      });
      h += `<h2>Итоговый план тренировок</h2><div class="plan">`;
      L.plan.forEach(r=>{ h += `<div class="plan-r"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`; });
      h += `</div></div>`;
    }

    if(d.workouts){
      h += `<div class="wks">`;
      d.workouts.forEach((w,i)=>{
        // Между тренировками — золотая линия с логотипом посередине.
        // Перед первой её нет, иначе разделитель висел бы в воздухе.
        if(i) h += `<div class="wk-sep"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#markpath"/></svg></div>`;
        h += `<div class="wk">
          <div class="wk-h">
            <span class="wk-n">Тренировка ${w.n}</span>
            <span class="wk-v">${w.vol} м</span>
          </div>
          <ol class="wk-i">${w.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
        </div>`;
      });
      h += `</div>`;
    }

    if(d.rows){
      h += `<div class="rows">`;
      d.rows.forEach(r=>{
        const go2 = (r[3] && T[r[3]]) ? ` onclick="go('${r[3]}')"` : "";
        h += `<button class="row"${go2}>
          ${r[0]?`<span class="idx">${esc(r[0])}</span>`:`<span class="idx">—</span>`}
          <span class="body"><span class="name">${esc(r[1])}</span>${r[2]?`<span class="note">${esc(r[2])}</span>`:""}</span>
          <span class="chev">›</span>
        </button>`;
      });
      h += `</div>`;
      h += `<div style="margin-top:26px" class="slot"><b>Сюда встаёт содержимое вкладки</b>Текст, таблицы упражнений, видео и файлы для скачивания</div>`;
    }

    if(d.errs){
      h += `<h2>Что делают не так</h2>`;
      d.errs.forEach((e,i)=>{ h += `<div class="err"><b>${i+1}.</b> ${esc(e)}</div>`; });
      h += `<h2>Что с этим делать</h2>`;
      h += `<button class="row"><span class="idx">▶</span><span class="body"><span class="name">${esc(d.fix)}</span><span class="note">упражнения и серии, которые убирают все ошибки сразу</span></span><span class="chev">›</span></button>`;
      h += `<div class="tipbox" style="margin-top:22px"><b>На что смотреть.</b> Ошибки почти никогда не приходят по одной. Начинайте с первой в списке — остальные часто уходят вместе с ней.</div>`;
    }

    if(d.posters){
      h += `<div class="grid-2">`;
      d.posters.forEach(p=>{
        h += `<button class="row">
          <span style="width:44px;height:62px;flex:none;border:1px solid var(--gold-line);border-radius:5px;background:rgba(185,138,46,.07);display:flex;align-items:center;justify-content:center;color:var(--gold-dk);font-size:19px">◱</span>
          <span class="body"><span class="name">${esc(p[0])}</span><span class="note">${esc(p[1])}</span></span>
          <span class="chev">›</span>
        </button>`;
      });
      h += `</div>`;
      h += `<div style="margin-top:22px" class="slot"><b>Обложки подгружаются автоматически</b>Фильмы через TMDB, книги через Open Library — по названию и году</div>`;
    }

    if(d.video){
      h += `<div class="grid-2">`;
      ["Разбор кроля","Разбор спины","Разбор брасса","Разбор баттерфляя","Старты и повороты","Вопросы и ответы"].forEach((v,i)=>{
        h += `<button class="row">
          <span style="width:60px;height:38px;flex:none;border:1px solid var(--gold-line);border-radius:5px;background:rgba(185,138,46,.07);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:14px">▶</span>
          <span class="body"><span class="name">${esc(v)}</span><span class="note">запись эфира</span></span>
          <span class="chev">›</span>
        </button>`;
      });
      h += `</div>`;
    }
  }

  document.getElementById("app").innerHTML = h;
  window.scrollTo({top:0,behavior:"instant"});
  setupVideos();
}

let vidObserver = null;
let frameObserver = null;

/* Плееры Kinescope грузим только когда до них доскроллили.
   autoplay=1&muted=1 — запуск без звука, звук включается кнопкой
   в самом плеере. autopause=1 — плеер сам ставится на паузу,
   если на странице запустился другой. */
function setupFrames(){
  const frames = Array.from(document.querySelectorAll(".vid iframe[data-src]"));
  if(!frames.length) return;

  if(frameObserver) frameObserver.disconnect();

  frameObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const f = en.target;
      f.src = f.dataset.src;
      f.removeAttribute("data-src");
      frameObserver.unobserve(f);
    });
  }, {threshold: 0.25});

  frames.forEach(f=>frameObserver.observe(f));
}

function setupVideos(){
  setupFrames();

  const vids = Array.from(document.querySelectorAll(".vid video"));
  if(!vids.length) return;

  if(vidObserver) vidObserver.disconnect();

  vidObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const v = en.target;
      if(en.isIntersecting){ v.play().catch(()=>{}); }
      else {
        v.pause();
        if(!v.muted){ v.muted = true; v.controls = false; v.closest(".vid").classList.remove("on"); }
      }
    });
  }, {threshold: 0.5});

  vids.forEach(v=>{
    /* Локального файла нет (например, папку с видео уже убрали
       из репозитория, а ID Kinescope ещё не вписан) — вместо
       чёрного прямоугольника показываем аккуратную заглушку. */
    v.addEventListener("error", ()=>{
      const box = v.closest(".vid");
      if(!box) return;
      const snd = box.querySelector(".snd");
      if(snd) snd.remove();
      const ph = document.createElement("div");
      ph.className = "vid-ph";
      ph.innerHTML = "<b>&#9654; Видео скоро появится</b>Ролик готовится к публикации";
      v.replaceWith(ph);
    });
    vidObserver.observe(v);
    v.addEventListener("click", ()=>{
      const box = v.closest(".vid");
      if(v.muted){
        vids.forEach(o=>{
          if(o !== v && !o.muted){
            o.muted = true; o.controls = false;
            o.closest(".vid").classList.remove("on");
          }
        });
        v.muted = false;
        v.controls = true;
        box.classList.add("on");
        v.play().catch(()=>{});
      } else {
        v.muted = true;
        v.controls = false;
        box.classList.remove("on");
      }
    });
  });
}

function go(id){ location.hash = id; }
window.addEventListener("hashchange", ()=> render(location.hash.slice(1) || "home"));
render(location.hash.slice(1) || "home");
</script>
