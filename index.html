<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плавательный остров VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B98A2E;
  --gold-lt:#D0A445;
  --gold-dk:#7E5C1E;
  --gold-dim:rgba(185,138,46,.16);
  --gold-line:rgba(185,138,46,.30);
  --bg:#080807;
  --surf:#111110;
  --surf-2:#191817;
  /* Золото читается металлом только на переходе: светлая кромка сверху,
     тёмная снизу. Один плоский цвет мозг видит как горчичный. */
  --gold-metal:linear-gradient(180deg,#F0D488 0%,#C79A3C 55%,#8A671F 100%);
  --gold-metal-dim:linear-gradient(180deg,#C9A24E 0%,#6E521B 100%);
  /* Кромка карточки: блик в верхнем левом углу, затухание к нижнему правому */
  --edge:linear-gradient(160deg,rgba(240,212,136,.42) 0%,rgba(185,138,46,.16) 38%,rgba(185,138,46,.05) 100%);
  --edge-soft:linear-gradient(160deg,rgba(240,212,136,.26) 0%,rgba(185,138,46,.11) 40%,rgba(185,138,46,.04) 100%);
  --card-fill:linear-gradient(165deg,#191712 0%,#121110 55%,#0e0d0c 100%);
  --txt:#F2EFE8;
  --txt-2:#A8A296;
  --txt-3:#6E6A62;
  /* Подписи под названиями: приглушённое золото вместо серого.
     Только для подписей — длинный текст этим цветом набирать нельзя. */
  --txt-sub:#B09563;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;
  padding-bottom:64px;
  -webkit-font-smoothing:antialiased;
}
/* Тёплое свечение сверху: контент лежит в свете, а не висит в пустоте.
   Отдельным слоем, чтобы не тянуться за прокруткой. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -12%, #17150f 0%, #0d0c0a 42%, #080807 100%);
}
/* Металлический перелив для коротких надписей и цифр */
.gold-metal{
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
/* Если браузер не умеет обрезать фон по буквам, текст стал бы невидимым.
   Возвращаем ему обычный золотой цвет. */
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .gold-metal,.wordmark,h2,.card .num,.row .idx{
    background:none;color:var(--gold);-webkit-text-fill-color:var(--gold)
  }
  .card .num,.row .idx{color:var(--gold-dk);-webkit-text-fill-color:var(--gold-dk)}
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{
  position:sticky;top:0;z-index:20;
  background:rgba(8,8,7,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--gold-line);
}
.hd{display:flex;align-items:center;gap:14px;padding:16px 0}
.mark{width:42px;height:42px;flex:none}
.wordmark{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;letter-spacing:.10em;line-height:1.1;
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.wordmark small{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.28em;color:var(--txt-3);margin-top:3px}
.hd-spacer{flex:1}
.acct{width:38px;height:38px;border:1px solid var(--gold-line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:13px;font-weight:500;flex:none}

.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:22px 0 6px;font-size:13px;color:var(--txt-3)}
.crumb a{color:var(--gold);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--gold-lt)}
.crumb span.sep{color:var(--txt-3)}

h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:600;letter-spacing:.01em;line-height:1.15;margin:6px 0 10px}
.lede{color:var(--txt-sub);font-size:16px;max-width:660px;margin-bottom:30px}
h2{
  font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  margin:38px 0 16px;display:flex;align-items:center;gap:10px;
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
h2::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(185,138,46,.35),transparent)
}

.hero{position:relative;padding:0;border:0;margin:0 -20px 8px;overflow:hidden}
.hero-in{position:relative;padding:64px 20px 30px;z-index:2}
.hero-photo{
  position:absolute;inset:0;z-index:0;
  background-image:url('hero.jpg');
  background-size:cover;background-position:center 58%;
}
@media(max-width:700px){.hero-photo{background-image:url('hero-mobile.jpg')}}
.hero-veil{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(8,8,7,.30) 0%,rgba(8,8,7,.52) 44%,rgba(8,8,7,.88) 82%,#080807 100%);
}
.hero-waves{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:2;pointer-events:none}
.hero .mark-big{width:70px;height:70px;margin-bottom:18px;display:block}
.hero h1{font-size:46px;margin-bottom:12px}
.hero .lede{margin-bottom:24px;color:var(--txt-2)}
.hero-note{font-size:11px;letter-spacing:.14em;color:var(--txt-3);margin-bottom:14px}
@media(max-width:600px){
  .hero{margin:0 -15px 8px}
  .hero-in{padding:42px 15px 22px}
  .hero h1{font-size:31px}
  .hero .mark-big{width:54px;height:54px}
}

/* Описание клуба на главной */
.about{max-width:700px;margin-bottom:8px}
.about p{margin:0 0 14px;font-size:15.5px;line-height:1.7;color:var(--txt-2)}
.facts{display:flex;flex-direction:column;gap:2px}
.fact{
  display:flex;align-items:center;gap:20px;
  padding:17px 0;border-bottom:1px solid rgba(185,138,46,.12)
}
.fact:last-child{border-bottom:0}
.fact-n{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
  font-size:48px;line-height:1.15;letter-spacing:0;
  min-width:118px;flex:none;text-align:right;white-space:nowrap;
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.fact-t{flex:1;font-size:15px;line-height:1.55;color:var(--txt-2)}
@media(max-width:600px){
  .about p{font-size:15px}
  .fact{gap:14px;padding:14px 0}
  .fact-n{font-size:36px;min-width:88px}
  .fact-t{font-size:14px}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

.card{
  border:1px solid transparent;border-radius:var(--r);
  background:var(--card-fill) padding-box, var(--edge) border-box;
  padding:20px 20px 18px;cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  display:flex;flex-direction:column;gap:7px;text-align:left;color:inherit;font:inherit;width:100%;
}
.card:hover{
  transform:translateY(-2px);
  background:var(--card-fill) padding-box, linear-gradient(160deg,rgba(240,212,136,.75) 0%,rgba(185,138,46,.28) 40%,rgba(185,138,46,.10) 100%) border-box;
  box-shadow:0 10px 26px rgba(0,0,0,.45)
}
.card:active{transform:translateY(0) scale(.985)}
.card .num{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;line-height:1;letter-spacing:.02em;
  background:var(--gold-metal-dim);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.card .ttl{
  font-size:16px;font-weight:500;color:#FBF7EE;margin-top:4px;
  text-transform:uppercase;letter-spacing:.09em;line-height:1.35
}
.card .sub{font-size:13.5px;color:var(--txt-sub);line-height:1.55}
.card .meta{
  align-self:flex-start;margin-top:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#C79A3C;background:rgba(185,138,46,.12);border-radius:20px;padding:4px 11px
}

.row{
  display:flex;align-items:center;gap:18px;
  border:1px solid transparent;border-radius:10px;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box;
  padding:16px 20px;cursor:pointer;transition:transform .16s ease, background .18s ease;
  text-align:left;color:inherit;font:inherit;width:100%;
}
.row:hover{background:var(--card-fill) padding-box, var(--edge) border-box}
.row:active{transform:scale(.99)}
/* Номер — часть оформления, а не подпись: крупная приглушённая цифра */
.row .idx{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;line-height:1;
  min-width:42px;flex:none;letter-spacing:.02em;
  background:var(--gold-metal-dim);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;opacity:.75
}
.row .idx.small{font-size:19px;color:rgba(185,138,46,.45);min-width:auto}
.row .body{flex:1;min-width:0}
.row .name{font-size:16.5px;font-weight:500;letter-spacing:.01em}
/* Короткая справка идёт прописными и не спорит с названием.
   Длинную оставляем обычным набором — капитель на фразу нечитаема. */
.row .note{
  display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-dk);margin-top:5px;line-height:1.45
}
.row .note.long{text-transform:none;letter-spacing:.01em;font-size:13px;color:var(--txt-sub);line-height:1.5}
.row .chev{color:var(--gold-dk);font-size:18px;line-height:1;flex:none}
@media(max-width:600px){
  .row{gap:14px;padding:15px 16px}
  .row .idx{font-size:28px;min-width:34px}
  .row .name{font-size:15.5px}
}
.rows{display:flex;flex-direction:column;gap:8px}

.pill{display:inline-block;font-size:11.5px;letter-spacing:.06em;color:var(--gold);background:var(--gold-dim);border-radius:20px;padding:4px 12px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}

.slot{
  border:1px dashed rgba(185,138,46,.34);border-radius:var(--r);
  padding:30px 22px;text-align:center;color:var(--txt-3);font-size:14px;background:rgba(185,138,46,.03)
}
.slot b{display:block;color:var(--gold);font-weight:500;font-size:15px;margin-bottom:6px;letter-spacing:.02em}

.err{background:var(--surf);border-left:3px solid #B0472F;border-radius:0;padding:14px 17px;font-size:14px;color:var(--txt-2);margin:16px 0}
.err b{color:#D2765C;font-weight:500}
.tipbox{background:var(--surf);border-left:3px solid var(--gold);border-radius:0;padding:14px 17px;font-size:14px;color:var(--txt-2);margin:16px 0}
.tipbox b{color:var(--gold);font-weight:500}

.lesson{max-width:760px}
.lesson .intro{background:var(--surf);border:1px solid rgba(185,138,46,.16);border-radius:var(--r);padding:20px 22px;margin-bottom:8px;color:var(--txt-2);font-size:15px;line-height:1.65}
.ex{margin:30px 0 0}
.ex-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.ex-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--gold-dk);line-height:1;min-width:34px}
.ex-t{font-size:21px;font-weight:500;letter-spacing:.01em;color:var(--txt)}
.goal,.hint{display:flex;gap:11px;padding:13px 16px;border-radius:10px;font-size:14.5px;line-height:1.6;margin-bottom:9px}
.goal{background:rgba(185,138,46,.07);border-left:3px solid var(--gold)}
.hint{background:var(--surf);border-left:3px solid var(--gold-dk)}
.goal i,.hint i{font-style:normal;color:var(--gold);flex:none;font-size:15px}
.goal b,.hint b{color:var(--gold);font-weight:500}
.goal span,.hint span{color:var(--txt-2)}
.vid{margin:14px 0 0;border-radius:10px;overflow:hidden;background:#000;border:1px solid rgba(185,138,46,.2)}
.vid video{width:100%;display:block;background:#000}
.vid-cap{padding:9px 14px;font-size:12.5px;color:var(--txt-3);letter-spacing:.03em;background:var(--surf)}
.vid{position:relative}
.vid .frame{position:relative;padding-top:56.25%;width:100%;background:#000}
.vid .frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.vid-ph{
  aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(185,138,46,.04);color:var(--txt-3);font-size:13px;text-align:center;padding:20px
}
.vid-ph b{color:var(--gold);font-weight:500;font-size:15px;letter-spacing:.02em}
.snd{
  position:absolute;right:10px;top:10px;z-index:3;
  display:flex;align-items:center;gap:7px;
  background:rgba(8,8,7,.72);backdrop-filter:blur(6px);
  border:1px solid rgba(185,138,46,.4);border-radius:20px;
  padding:6px 13px;font-size:12px;color:var(--gold);
  cursor:pointer;pointer-events:none;transition:opacity .25s;letter-spacing:.02em
}
.vid.on .snd{opacity:0}
.vid video{cursor:pointer}
/* Тренировки: карточка + золотой разделитель между ними */
.wks{max-width:780px}
.wk{
  background:var(--surf);border:1px solid rgba(185,138,46,.16);
  border-radius:var(--r);overflow:hidden
}
.wk-h{
  display:flex;align-items:center;gap:12px;
  padding:13px 20px;background:rgba(185,138,46,.07);
  border-bottom:1px solid rgba(185,138,46,.18)
}
.wk-n{
  font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);flex:1
}
.wk-v{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;
  color:var(--gold-lt);letter-spacing:.03em;flex:none
}
.wk-i{margin:0;padding:16px 20px 18px 20px;list-style:none;counter-reset:wkstep}
.wk-i li{
  counter-increment:wkstep;position:relative;
  padding:0 0 0 30px;margin-bottom:11px;
  font-size:14.5px;line-height:1.6;color:var(--txt-2)
}
.wk-i li:last-child{margin-bottom:0}
.wk-i li::before{
  content:counter(wkstep);position:absolute;left:0;top:1px;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;
  color:var(--gold-dk);line-height:1.5
}
.wk-sep{display:flex;align-items:center;gap:16px;margin:26px 0}
.wk-sep::before,.wk-sep::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(185,138,46,.42),transparent)
}
.wk-sep svg{width:20px;height:20px;flex:none;opacity:.6}

/* Одна тренировка целиком: разбор, серии, подсказки */
.one{max-width:780px}
.story{
  background:var(--surf);border:1px solid rgba(185,138,46,.16);border-radius:var(--r);
  padding:20px 22px;margin-bottom:8px;color:var(--txt-2);font-size:15px;line-height:1.65
}
.sets{margin-top:2px}
.set{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid rgba(185,138,46,.10)}
.set:last-child{border-bottom:0}
.set-v{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:var(--gold);
  min-width:64px;flex:none;text-align:right;letter-spacing:.02em;padding-top:1px
}
.set-t{flex:1;min-width:0;font-size:14.5px;line-height:1.6;color:var(--txt-2)}
.set-hint{
  display:block;margin-top:9px;padding:10px 14px;border-left:2px solid var(--gold-dk);
  background:rgba(185,138,46,.05);font-size:13.5px;line-height:1.55;color:var(--txt-3)
}
.set-hint b{color:var(--gold-dk);font-weight:500}
.sets.novol .set-v{display:none}
.sets.novol .set{gap:0}
.safebox{
  background:var(--surf);border-left:3px solid #B0472F;
  padding:14px 17px;font-size:14px;line-height:1.6;color:var(--txt-2);margin:22px 0 0
}
.safebox b{color:#D2765C;font-weight:500}

/* Текстовая страница: упражнение, ошибка, поворот, часть теории */
.doc{max-width:760px}
.doc h3{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;
  color:var(--txt);letter-spacing:.01em;margin:28px 0 10px
}
.doc p{margin:0 0 12px;font-size:15px;line-height:1.7;color:var(--txt-2)}
.doc ul,.doc ol{margin:0 0 14px;padding:0;list-style:none;counter-reset:docstep}
.doc li{
  position:relative;padding-left:26px;margin-bottom:10px;
  font-size:14.5px;line-height:1.65;color:var(--txt-2)
}
.doc li:last-child{margin-bottom:0}
.doc ul li::before{
  content:"";position:absolute;left:6px;top:10px;
  width:5px;height:5px;border-radius:50%;background:var(--gold-dk)
}
.doc ol li{counter-increment:docstep;padding-left:30px}
.doc ol li::before{
  content:counter(docstep);position:absolute;left:0;top:0;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:var(--gold-dk)
}
.doc h4{
  font-size:16.5px;font-weight:500;color:var(--gold-lt);
  letter-spacing:.01em;margin:22px 0 8px
}
.doc .kv{margin:0 0 8px;font-size:14.5px;line-height:1.6;color:var(--txt-2)}
.doc .kv b{color:var(--gold-dk);font-weight:500}
.doc .lead-box{
  background:var(--surf);border:1px solid rgba(185,138,46,.16);border-radius:var(--r);
  padding:18px 20px;margin-bottom:6px;color:var(--txt-2);font-size:15px;line-height:1.65
}
@media(max-width:600px){
  .set{gap:11px}
  .set-v{min-width:52px;font-size:15px}
  .set-t{font-size:14px}
  .story{padding:16px 17px}
}
@media(max-width:600px){
  .wk-h{padding:12px 15px}
  .wk-i{padding:14px 15px 16px 15px}
  .wk-i li{padding-left:26px;font-size:14px}
}

.plan{margin-top:14px;border:1px solid rgba(185,138,46,.2);border-radius:var(--r);overflow:hidden}
.plan-r{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid rgba(185,138,46,.14);font-size:14.5px}
.plan-r:last-child{border-bottom:0}
.plan-r b{color:var(--gold);font-weight:500;flex:none;min-width:62px}
.plan-r span{color:var(--txt-2)}
@media(max-width:600px){.ex-n{font-size:24px;min-width:26px}.ex-t{font-size:18px}}
footer{border-top:1px solid rgba(185,138,46,.14);margin-top:56px;padding:22px 0 8px;color:var(--txt-3);font-size:12.5px;letter-spacing:.04em}

@media(max-width:600px){
  .wrap{padding:0 15px}
  h1{font-size:29px}
  .hero h1{font-size:32px}
  .hero{padding:26px 0 4px}
  .grid,.grid-2{grid-template-columns:1fr}
  .wordmark{font-size:19px}
  .mark{width:36px;height:36px}
}
</style>

/* Разворачиваем данные выносливости в экраны: уровень → пять блоков → пять тренировок.
   Восемнадцать экранов писать руками не нужно, они собираются отсюда. */
Object.keys(AERO).forEach(lvl=>{
  const L = AERO[lvl];
  T[lvl] = {
    title: "Выносливость. " + L.level,
    lede: "Пять блоков. Внутри каждого — пять готовых тренировок.",
    pills: [L.level, L.vol + " за занятие"],
    kids: L.blocks.map(b=>({
      id: lvl + "_" + b.n,
      n: "№ " + b.n,
      t: b.t,
      s: b.sub,
      m: b.w.length + " тренировок"
    }))
  };
  PARENT[lvl] = "b_vy";

  L.blocks.forEach(b=>{
    const id = lvl + "_" + b.n;
    T[id] = {
      title: "Блок № " + b.n + ". " + b.t,
      lede: b.sub,
      pills: [L.level, b.w.length + " тренировок"],
      workouts: b.w
    };
    PARENT[id] = lvl;
  });
});

/* Скорость, мощность и восстановление устроены иначе: там нет блоков,
   а есть пятнадцать самостоятельных тренировок на каждом уровне.
   Путь: направление → уровень → список тренировок → одна тренировка. */
const LSUB = {
  "Новичок":     "Короче отрезки, больше отдыха",
  "Средний":     "Работа по интервалу",
  "Продвинутый": "Полный объём и минимальный отдых"
};

Object.keys(BLOCKS).forEach(dir=>{
  const D = BLOCKS[dir];
  const lvls = Object.keys(D.levels);

  T[dir] = {
    title: D.name,
    lede: D.lede + " Выберите уровень.",
    kids: lvls.map((k,i)=>{
      const L = D.levels[k];
      return {
        id: k, n: "0" + (i+1), t: L.level, s: LSUB[L.level],
        m: L.vol + " · " + L.w.length + " тренировок"
      };
    })
  };

  lvls.forEach(k=>{
    const L = D.levels[k];
    T[k] = {
      title: D.name + ". " + L.level,
      lede: "Пятнадцать готовых тренировок. Порядок свободный — берите ту, что подходит по задаче.",
      pills: [L.level, L.vol + " за занятие"],
      slot: false,
      rows: L.w.map(w=>[String(w.n), "Тренировка " + w.n, w.note, k + "_" + w.n])
    };
    PARENT[k] = dir;

    L.w.forEach(w=>{
      const id = k + "_" + w.n;
      T[id] = {
        title: "Тренировка " + w.n,
        pills: [D.name, L.level, w.vol + " м"],
        one: w
      };
      PARENT[id] = k;
    });
  });
});

/* Раздел «Обучение»: упражнения по стилям, типичные ошибки,
   старты и повороты. Экраны собираются из obuchenie.js. */
// «21 упражнение», но «22 упражнения» и «18 упражнений» — считаем сами,
// чтобы подписи не разъезжались с содержимым при любой правке данных.
function plural(n, forms){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return n + " " + forms[2];
  if(b > 1 && b < 5) return n + " " + forms[1];
  if(b === 1) return n + " " + forms[0];
  return n + " " + forms[2];
}
const nDrills = n => plural(n, ["упражнение","упражнения","упражнений"]);
const nErrors = n => plural(n, ["ошибка","ошибки","ошибок"]);

(function(){
  const put = (id, screen, parent)=>{ T[id] = screen; if(parent) PARENT[id] = parent; };

  // Совершенствование техники: стиль → список упражнений → упражнение
  T.s1_2.rows = [];
  UCH.drills.forEach((g,i)=>{
    T.s1_2.rows.push(["1.2." + (i+1), g.name, nDrills(g.items.length), g.key]);
    put(g.key, {
      title: g.name + ". Упражнения",
      lede: "Техническая работа для тех, кто уже держится на воде и хочет плыть длиннее и легче.",
      pills: [nDrills(g.items.length)],
      slot: false,
      rows: g.items.map(x=>[String(x.n), x.title, x.cat, g.key + "_" + x.n])
    }, "s1_2");
    g.items.forEach(x=>put(g.key + "_" + x.n, {
      title: x.title, pills: [g.name, x.cat, x.level], doc: x.doc
    }, g.key));
  });

  // Типичные ошибки: стиль → список ошибок → разбор ошибки
  UCH.errors.forEach((g,i)=>{
    const k = T.s1_4.kids[i];
    if(k){ k.s = nErrors(g.items.length) + " с разбором"; k.m = ""; }
    put(g.key, {
      title: "Ошибки: " + g.name.toLowerCase(),
      lede: "Самые частые ошибки любителя. У каждой — почему она возникает и чем её исправить.",
      pills: [nErrors(g.items.length)],
      slot: false,
      rows: g.items.map(x=>[String(x.n), x.title, "", g.key + "_" + x.n])
    }, "s1_4");
    g.items.forEach(x=>put(g.key + "_" + x.n, {
      title: x.title, pills: [g.name, "Ошибка " + x.n], lead: x.lead, doc: x.doc
    }, g.key));
  });

  // Старты: теория по частям + упражнения
  const S = UCH.starts;
  put("st0", {
    title: "Стартовый прыжок",
    lede: "Поэтапное обучение с нуля для взрослых — от первого спада в воду до старта с тумбы.",
    pills: [S.theory.length + " частей", S.drills.length + " упражнения"],
    slot: false,
    rows: S.theory.map((p,i)=>["", p.title, "", "st_p" + (i+1)])
      .concat(S.drills.map(x=>["", x.title, "Упражнение · " + x.cat, "st_d" + x.n]))
  }, "s1_3");
  S.theory.forEach((p,i)=>put("st_p" + (i+1), { title: p.title, doc: p.doc }, "st0"));
  S.drills.forEach(x=>put("st_d" + x.n, {
    title: x.title, pills: ["Старт", x.cat, x.level], doc: x.doc
  }, "st0"));

  // Повороты: одиннадцать поворотов + упражнения
  const V = UCH.turns;
  put("tn0", {
    title: "Повороты",
    lede: "Одиннадцать поворотов: где применяется, что говорят правила, за что снимают и как учить.",
    pills: [V.list.length + " поворотов", V.drills.length + " упражнения"],
    slot: false,
    rows: V.list.map(x=>[String(x.n), x.title, x.note, "tn_" + x.n])
      .concat(V.drills.map(x=>["", x.title, "Упражнение · " + x.cat, "tnd_" + x.n]))
  }, "s1_3");
  V.list.forEach(x=>put("tn_" + x.n, {
    title: x.title, pills: ["Поворот " + x.n, x.level], lead: x.lead, doc: x.doc
  }, "tn0"));
  V.drills.forEach(x=>put("tnd_" + x.n, {
    title: x.title, pills: ["Повороты", x.cat, x.level], doc: x.doc
  }, "tn0"));
})();

/* Раздел «Суша для пловца» из susha.js.
   Файл писал не я, поэтому собираю бережно: беру только те поля,
   которые в данных реально есть, и ничего не додумываю. */
(function(){
  // Каждая вкладка собирается независимо: нет файла с данными —
  // остаётся заглушка, но остальные вкладки от этого не страдают.
  const put = (id, screen, parent)=>{ T[id] = screen; if(parent) PARENT[id] = parent; };
  const D = [];
  const p  = (d,t)=>{ if(t) d.push(["p", t]); };
  const ul = (d,a)=>{ if(a && a.length) d.push(["ul", a]); };
  const kv = (d,label,t)=>{ if(t) d.push(["kv", [label, t]]); };
  const warn = (d,t)=>{ if(t) d.push(["warn", t]); };
  const tip  = (d,t)=>{ if(t) d.push(["tip", t]); };
  const h2 = (d,t)=>{ if(t) d.push(["h2", t]); };
  const h3 = (d,t)=>{ if(t) d.push(["h3", t]); };

  // Карточка упражнения из каталога: код, название и всё, что к нему приложено
  const exBlocks = (d, x)=>{
    d.push(["h4", (x.code ? x.code + ". " : (x.n ? x.n + ". " : "")) + x.name]);
    kv(d, "Как выполнять", x.how);
    kv(d, "Что даёт в воде", x.benefit || x.why);
    kv(d, "Дозировка", x.dose);
    kv(d, "Легче", x.easier);
    kv(d, "Сложнее", x.harder);
    kv(d, "На что смотреть", x.watch);
  };

  // Каталог: зоны с упражнениями на одной странице
  const catalogue = (id, src, parent, lede)=>{
    const d = [];
    p(d, src.intro);
    (src.zones||[]).forEach(z=>{ h3(d, z.title); (z.items||[]).forEach(x=>exBlocks(d, x)); });
    tip(d, src.watch);
    warn(d, src.safety);
    const n = (src.zones||[]).reduce((s,z)=>s+(z.items||[]).length,0);
    put(id, { title: src.title, lede, pills: [nDrills(n)], doc: d }, parent);
    return n;
  };

  /* ---- 3.1 Разминка перед водой ---- */
  if(typeof SUSHA_WARMUP !== "undefined"){
    const W = SUSHA_WARMUP, d = [];
    p(d, W.intro);
    ul(d, W.equip);
    (W.parts||[]).forEach(part=>{
      h3(d, part.title);
      p(d, part.note);
      (part.items||[]).forEach(x=>{
        d.push(["h4", x.n + ". " + x.name]);
        kv(d, "Как выполнять", x.how);
        kv(d, "Зачем", x.why);
        kv(d, "На что смотреть", x.watch);
      });
    });
    tip(d, W.total);
    warn(d, W.safety);
    const n = (W.parts||[]).reduce((s,x)=>s+(x.items||[]).length,0);
    put("d1", { title: W.title, lede: W.subtitle, pills: [nDrills(n)], doc: d }, "s3");
  }

  /* ---- 3.2 Гребковые тренировки на резине ---- */
  if(typeof SUSHA_BAND !== "undefined"){
    const B = SUSHA_BAND, rows = [];
    const block = (id, o, extra)=>{
      if(!o) return;
      const d = [];
      p(d, o.how || o.rule || o.intro);
      ul(d, o.points || o.items);
      tip(d, o.watch);
      if(extra) extra(d);
      put(id, { title: o.title, pills: o.duration ? [o.duration] : [], doc: d }, "d2");
      rows.push(["", o.title, o.duration || "", id]);
    };
    block("d2_set", B.setup);
    block("d2_fit", B.fit);

    const SN = { crawl:"Кроль", dolphin:"Дельфин", butterfly:"Дельфин", breast:"Брасс", breaststroke:"Брасс" };
    Object.keys(B.strokes||{}).forEach(k=>{
      const S = B.strokes[k], d = [];
      p(d, S.note);
      (S.phases||[]).forEach(f=>{
        d.push(["h4", f.n + ". " + f.name]);
        kv(d, "Дозировка", f.dose);
        kv(d, "Как выполнять", f.how);
        kv(d, "На что смотреть", f.watch);
        kv(d, "Частая ошибка", f.mistake);
      });
      const id = "d2_" + k;
      put(id, { title: S.name || SN[k] || k, pills: [(S.phases||[]).length + " фазы гребка"], doc: d }, "d2");
      rows.push(["", S.name || SN[k] || k, (S.phases||[]).map(f=>f.name).join(", "), id]);
    });

    block("d2_cool", B.cooldown);

    if(B.checklist || B.safety){
      const c = [];
      ul(c, B.checklist);
      warn(c, B.safety);
      put("d2_check", { title: "Контрольный список", doc: c }, "d2");
      rows.push(["", "Контрольный список", "пять пунктов, по которым себя проверяют", "d2_check"]);
    }

    const d = [];
    p(d, B.intro);
    ul(d, B.equip);
    put("d2", { title: B.title, lede: B.subtitle, slot: false, rows, doc: d }, "s3");
  }

  /* ---- 3.3 Кор и стабилизация ---- */
  if(typeof SUSHA_STATICS !== "undefined"){

    const nDy = catalogue("d3_dy", SUSHA_DYNAMICS, "d3", "Движения: справочник с техникой и дозировкой.");

    (typeof SUSHA_CORE_COMPLEXES !== "undefined" ? SUSHA_CORE_COMPLEXES : []).forEach(c=>{
      const d = [];
      p(d, c.desc);

      tip(d, c.watch);
      const id = "d3_c" + c.n;
      put(id, { title: c.title, lede: c.tag, doc: d }, "d3");
      rows.push([String(c.n), c.title, c.tag, id]);
    });

    if(typeof SUSHA_DRESSEL !== "undefined"){
      const R = SUSHA_DRESSEL, d = [];
      p(d, R.about);
      ul(d, R.rules);
      h2(d, "Упражнения");
      (R.items||[]).forEach(x=>exBlocks(d, x));
      if(R.table){
        h2(d, "Схема раундов");
        (R.table.rows||[]).forEach(r=>d.push(["kv", [r[0], R.table.head.slice(1).map((hd,i)=>hd + ": " + r[i+1]).join(" · ")]]));
      }
      kv(d, "Коротко", R.short);
      kv(d, "Как часто", R.frequency);
      tip(d, R.watch);
      warn(d, R.safety);
      put("d3_dr", { title: R.title, lede: R.tag, doc: d }, "d3");
      rows.push(["", R.title, R.short || R.tag, "d3_dr"]);
    }

    if(typeof SUSHA_CORE_HOWTO !== "undefined"){
      const H = SUSHA_CORE_HOWTO, d = [];
      p(d, H.intro); ul(d, H.points); tip(d, H.watch); p(d, H.scale); warn(d, H.safety);
      put("d3_how", { title: H.title, doc: d }, "d3");
      rows.push(["", H.title, "таймер, дозировка и как менять сложность", "d3_how"]);
    }

    put("d3", { title: "Кор и стабилизация",
      lede: "Справочник удержаний и движений плюс готовые комплексы по таймеру.",
      slot: false, rows }, "s3");
  }

  /* ---- 3.4 Круговые тренировки ---- */
  if(typeof SUSHA_CIRCUIT_EX !== "undefined"){
    const rows = [];
    const nEx = catalogue("d4_ex", SUSHA_CIRCUIT_EX, "d4", "Станции: техника, дозировка и варианты полегче.");
    rows.push(["", SUSHA_CIRCUIT_EX.title, nDrills(nEx), "d4_ex"]);

    (typeof SUSHA_CIRCUIT_WORKOUTS !== "undefined" ? SUSHA_CIRCUIT_WORKOUTS : []).forEach(c=>{
      const d = [];
      p(d, c.desc);
      h2(d, "Станции");
      (c.stations||[]).forEach(x=>d.push(["kv", [x.code + ". " + x.name, x.amount || ""]]));
      tip(d, c.watch);
      const id = "d4_w" + c.n;
      put(id, { title: c.title, lede: c.tag, doc: d }, "d4");
      rows.push([String(c.n), c.title, c.tag, id]);
    });

    if(typeof SUSHA_CIRCUIT_HOWTO !== "undefined"){
      const H = SUSHA_CIRCUIT_HOWTO, d = [];
      p(d, H.intro); ul(d, H.points);
      kv(d, "Разминка", H.warmup);
      kv(d, "Заминка", H.cooldown);
      p(d, H.scale); warn(d, H.safety);
      put("d4_how", { title: H.title, doc: d }, "d4");
      rows.push(["", H.title, "таймер, разминка и заминка", "d4_how"]);
    }

    put("d4", { title: "Круговые тренировки",
      lede: "Общая физподготовка: всё тело, высокий пульс, около тридцати минут.",
      slot: false, rows }, "s3");
  }

  /* ---- 3.5 Гибкость ---- */
  if(typeof SUSHA_FLEX_EX !== "undefined"){
    const rows = [];

    // справочник: зоны с упражнениями
    {
      const E = SUSHA_FLEX_EX, d = [];
      p(d, E.intro);

    (typeof SUSHA_FLEX_COMPLEXES !== "undefined" ? SUSHA_FLEX_COMPLEXES : []).forEach(c=>{

      h2(d, H.whenTitle); ul(d, H.when);

    put("d5", { title: "Гибкость",
      lede: "Единственная вкладка раздела, где работа идёт не над мышцами, а над тем, что мешает им работать.",
      slot: false, rows }, "s3");
  }
})();

/* Числа в описании на главной подставляем из самих данных: сколько
   в файлах реально лежит, столько и обещаем. Разойтись не может. */
(function(){
  const A = T.home.about;
  if(!A) return;
  const zc = o => (typeof o !== "undefined" && o && o.zones) ? o.zones.reduce((s,z)=>s+(z.items||[]).length,0) : 0;
  const N = {};

  if(typeof AERO !== "undefined" && typeof BLOCKS !== "undefined"){
    let n = 0;
    Object.values(AERO).forEach(L=>L.blocks.forEach(b=>n += b.w.length));
    Object.values(BLOCKS).forEach(D=>Object.values(D.levels).forEach(L=>n += L.w.length));
    N.trainings = n;
  }
  if(typeof UCH !== "undefined"){
    N.drills = UCH.drills.reduce((s,g)=>s+g.items.length,0);
    N.errors = UCH.errors.reduce((s,g)=>s+g.items.length,0);
    N.turns  = UCH.turns.list.length;
  }
  N.dry = zc(typeof SUSHA_STATICS !== "undefined" ? SUSHA_STATICS : null)
        + zc(typeof SUSHA_DYNAMICS !== "undefined" ? SUSHA_DYNAMICS : null)
        + zc(typeof SUSHA_CIRCUIT_EX !== "undefined" ? SUSHA_CIRCUIT_EX : null)
        + zc(typeof SUSHA_FLEX_EX !== "undefined" ? SUSHA_FLEX_EX : null)
        + (typeof SUSHA_WARMUP !== "undefined" ? (SUSHA_WARMUP.parts||[]).reduce((s,p)=>s+(p.items||[]).length,0) : 0);

  // «{dry}+» — округляем вниз до десятков и оставляем плюс: обещаем меньше,
  // чем есть. Строку с неизвестным числом убираем, а не показываем «{drills}».
  A.points = A.points
    .map(([num, text])=>{
      const plus = String(num).endsWith("+");
      const m = String(num).match(/^\{([a-z]+)(?:\|(\d+))?\}/);
      if(!m || !N[m[1]]) return null;
      // шаг округления задан в самой строке: 210 при шаге 100 даёт «200+»
      const step = m[2] ? +m[2] : 1;
      const v = Math.floor(N[m[1]] / step) * step;
      return [v + (plus ? "+" : ""), text];
    })
    .filter(Boolean);
})();

/* Мотивация: на сайте лежало по 12 позиций из 15 и без описаний.

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function crumbs(id){
  const chain=[];let cur=id;
  while(cur && cur!=="home"){chain.unshift(cur);cur=PARENT[cur];}
  let h='<a onclick="go(\'home\')">Главное</a>';
  chain.forEach((c,i)=>{
    h+=' <span class="sep">/</span> ';
    h+= i===chain.length-1 ? esc(T[c].title) : `<a onclick="go('${c}')">${esc(T[c].title)}</a>`;
  });
  return `<div class="crumb">${h}</div>`;
}

  if(id==="home"){
    h += `<div class="hero">
      <div class="hero-photo"></div><div class="hero-veil"></div>
      <svg class="hero-waves" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-40 62 Q 110 26 260 62 T 560 62 T 860 62 T 1240 62" fill="none" stroke="#B98A2E" stroke-width="1.4" opacity=".22"/>
        <path d="M-40 82 Q 110 46 260 82 T 560 82 T 860 82 T 1240 82" fill="none" stroke="#B98A2E" stroke-width="1.4" opacity=".16"/>
        <path d="M-40 102 Q 110 66 260 102 T 560 102 T 860 102 T 1240 102" fill="none" stroke="#B98A2E" stroke-width="1.4" opacity=".11"/>
        <path d="M-40 122 Q 110 86 260 122 T 560 122 T 860 122 T 1240 122" fill="none" stroke="#B98A2E" stroke-width="1.4" opacity=".07"/>
      </svg>
      <div class="hero-in">
        <svg class="mark-big" viewBox="0 0 512 512" aria-hidden="true"><use href="#markpath"/></svg>
        <div class="hero-note">ЗАКРЫТЫЙ КЛУБ ДЛЯ ПЛОВЦОВ</div>
        <h1>${esc(d.title)}</h1>
        <p class="lede">${esc(d.lede)}</p>
      </div>
    </div>`;
    if(d.about){
      const A = d.about;
      h += `<div class="about">`;
      (A.text||[]).forEach(t=>{ h += `<p>${esc(t)}</p>`; });
      if(A.points && A.points.length){
        h += `<h2>Что внутри</h2><div class="facts">`;
        A.points.forEach(([num, text])=>{
          h += `<div class="fact"><span class="fact-n">${esc(num)}</span><span class="fact-t">${esc(text)}</span></div>`;
        });
        h += `</div>`;
      }
      h += `</div>`;
    }

    h += `<h2>Разделы</h2><div class="grid">`;
    d.kids.forEach(k=>{
      h += `<button class="card" onclick="go('${k.id}')">
        <span class="num">${esc(k.n)}</span>
        <span class="ttl">${esc(k.t)}</span>
        <span class="sub">${esc(k.s)}</span>
        ${k.m?`<span class="meta">${esc(k.m)}</span>`:""}
      </button>`;
    });
    h += `</div>`;
  } else {
    h += crumbs(id);
    h += `<h1>${esc(d.title)}</h1>`;
    if(d.lede) h += `<p class="lede">${esc(d.lede)}</p>`;
    if(d.pills) h += `<div class="pills">${d.pills.map(p=>`<span class="pill">${esc(p)}</span>`).join("")}</div>`;

    if(d.kids){
      h += `<div class="grid">`;
      d.kids.forEach(k=>{
        h += `<button class="card" onclick="go('${k.id}')">
          <span class="num">${esc(k.n)}</span>
          <span class="ttl">${esc(k.t)}</span>
          <span class="sub">${esc(k.s)}</span>
          ${k.m?`<span class="meta">${esc(k.m)}</span>`:""}
        </button>`;
      });
      h += `</div>`;
    }

if(d.lesson){
      const L=d.lesson;
      h += `<div class="lesson"><div class="intro">${esc(L.intro)}</div>`;
      L.ex.forEach(e=>{
        const kid = (KINESCOPE[e.v] || "").trim();
        const player = kid
          ? `<div class="frame"><iframe
                data-src="https://kinescope.io/embed/${encodeURIComponent(kid)}?autoplay=1&muted=1&loop=1&autopause=1&playsinline=1&title=0"
                allow="autoplay; fullscreen; picture-in-picture; encrypted-media;"
                frameborder="0" allowfullscreen loading="lazy"></iframe></div>`
          : `<video muted loop playsinline preload="metadata" src="Баттерфляй с нуля — видео/${esc(e.v)}"></video>
             <div class="snd">&#9834; нажмите, чтобы включить звук</div>`;
        h += `<div class="ex">
          <div class="ex-h"><span class="ex-n">${e.n}</span><span class="ex-t">${esc(e.t)}</span></div>
          <div class="goal"><i>&#9673;</i><span><b>Цель.</b> ${esc(e.goal)}</span></div>
          <div class="hint"><i>&#10003;</i><span><b>Совет.</b> ${esc(e.hint)}</span></div>
          <div class="vid">
            ${player}
            <div class="vid-cap">Упражнение ${e.n} — показ</div>
          </div>
        </div>`;
      });
      h += `<h2>Итоговый план тренировок</h2><div class="plan">`;
      L.plan.forEach(r=>{ h += `<div class="plan-r"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`; });
      h += `</div></div>`;
    }

    if(d.doc){
      h += `<div class="doc">`;
      if(d.lead) h += `<div class="lead-box">${esc(d.lead)}</div>`;
      d.doc.forEach(([type,val])=>{
        if(type==="h2") h += `<h2>${esc(val)}</h2>`;
        else if(type==="h3") h += `<h3>${esc(val)}</h3>`;
        else if(type==="h4") h += `<h4>${esc(val)}</h4>`;
        else if(type==="kv") h += `<div class="kv"><b>${esc(val[0])}.</b> ${esc(val[1])}</div>`;
        else if(type==="p") h += `<p>${esc(val)}</p>`;
        else if(type==="ul") h += `<ul>${val.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
        else if(type==="num") h += `<ol>${val.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
        else if(type==="tip") h += `<div class="tipbox"><b>Совет.</b> ${esc(val)}</div>`;
        else if(type==="warn") h += `<div class="safebox"><b>Безопасность.</b> ${esc(val)}</div>`;
      });
      h += `</div>`;
    }

    if(d.one){
      const W = d.one;
      // Пункт серии: [объём, текст, подсказка]. Объёма может не быть —
      // тогда колонку с метрами убираем целиком, чтобы не зияла пустотой.
      const series = (title, arr) => {
        if(!arr || !arr.length) return "";
        const novol = arr.every(x=>x[0]==null);
        return `<h2>${title}</h2><div class="sets${novol?" novol":""}">` + arr.map(x=>`
          <div class="set">
            <span class="set-v">${x[0]==null?"":x[0]+" м"}</span>
            <span class="set-t">${esc(x[1])}${x[2]?`<span class="set-hint"><b>На что смотреть.</b> ${esc(x[2])}</span>`:""}</span>
          </div>`).join("") + `</div>`;
      };
      h += `<div class="one">`;
      h += `<div class="story">${esc(W.story)}</div>`;
      h += series("Разминка", W.warm);
      h += series("Основная часть", W.main);
      h += series("Откуп", W.cool);
      if(W.safe) h += `<div class="safebox"><b>Безопасность.</b> ${esc(W.safe)}</div>`;
      h += `</div>`;
    }

    if(d.workouts){
      h += `<div class="wks">`;
      d.workouts.forEach((w,i)=>{
        // Между тренировками — золотая линия с логотипом посередине.
        // Перед первой её нет, иначе разделитель висел бы в воздухе.
        if(i) h += `<div class="wk-sep"><svg viewBox="0 0 512 512" aria-hidden="true"><use href="#markpath"/></svg></div>`;
        h += `<div class="wk">
          <div class="wk-h">
            <span class="wk-n">Тренировка ${w.n}</span>
            <span class="wk-v">${w.vol} м</span>
          </div>
          <ol class="wk-i">${w.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
        </div>`;
      });
      h += `</div>`;
    }

    if(d.rows){
      // Капитель решаем на весь список разом: если хоть одна подпись
      // длинная, обычным набором идут все. Вперемешку выглядит неряшливо.
      const longNotes = d.rows.some(r=>r[2] && String(r[2]).length > 44);
      h += `<div class="rows">`;
      d.rows.forEach(r=>{
        const go2 = (r[3] && T[r[3]]) ? ` onclick="go('${r[3]}')"` : "";
        // Простой номер набираем крупно и с ведущим нулём, составной
        // («1.2.1») — мельче, иначе он лезет на название. Нет номера —
        // колонки нет вовсе, чтобы слева не зияла пустота.
        const raw = r[0] == null ? "" : String(r[0]);
        const plainNum = /^\d+$/.test(raw);
        const idx = raw ? `<span class="idx${plainNum ? "" : " small"}">${esc(plainNum ? raw.padStart(2,"0") : raw)}</span>` : "";
        const note = r[2] ? `<span class="note${longNotes ? " long" : ""}">${esc(r[2])}</span>` : "";
        h += `<button class="row"${go2}>
          ${idx}
          <span class="body"><span class="name">${esc(r[1])}</span>${note}</span>
          <span class="chev">›</span>
        </button>`;
      });
      h += `</div>`;
      // Заглушка только на экранах, которые ещё не наполнены.
      if(d.slot !== false) h += `<div style="margin-top:26px" class="slot"><b>Сюда встаёт содержимое вкладки</b>Текст, таблицы упражнений, видео и файлы для скачивания</div>`;
    }

    if(d.errs){
      h += `<h2>Что делают не так</h2>`;
      d.errs.forEach((e,i)=>{ h += `<div class="err"><b>${i+1}.</b> ${esc(e)}</div>`; });
      h += `<h2>Что с этим делать</h2>`;
      h += `<button class="row"><span class="idx">▶</span><span class="body"><span class="name">${esc(d.fix)}</span><span class="note">упражнения и серии, которые убирают все ошибки сразу</span></span><span class="chev">›</span></button>`;
      h += `<div class="tipbox" style="margin-top:22px"><b>На что смотреть.</b> Ошибки почти никогда не приходят по одной. Начинайте с первой в списке — остальные часто уходят вместе с ней.</div>`;
    }

    if(d.posters){
      h += `<div class="grid-2">`;
      d.posters.forEach(p=>{
        h += `<button class="row">
          <span style="width:44px;height:62px;flex:none;border:1px solid var(--gold-line);border-radius:5px;background:rgba(185,138,46,.07);display:flex;align-items:center;justify-content:center;color:var(--gold-dk);font-size:19px">◱</span>
          <span class="body"><span class="name">${esc(p[0])}</span><span class="note">${esc(p[1])}</span></span>
          <span class="chev">›</span>
        </button>`;
      });
      h += `</div>`;
      h += `<div style="margin-top:22px" class="slot"><b>Обложки подгружаются автоматически</b>Фильмы через TMDB, книги через Open Library — по названию и году</div>`;
    }

    if(d.video){
      h += `<div class="grid-2">`;
      ["Разбор кроля","Разбор спины","Разбор брасса","Разбор баттерфляя","Старты и повороты","Вопросы и ответы"].forEach((v,i)=>{
        h += `<button class="row">
          <span style="width:60px;height:38px;flex:none;border:1px solid var(--gold-line);border-radius:5px;background:rgba(185,138,46,.07);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:14px">▶</span>
          <span class="body"><span class="name">${esc(v)}</span><span class="note">запись эфира</span></span>
          <span class="chev">›</span>
        </button>`;
      });
      h += `</div>`;
    }
  }

  document.getElementById("app").innerHTML = h;
  window.scrollTo({top:0,behavior:"instant"});
  setupVideos();
}

let vidObserver = null;
let frameObserver = null;

/* Плееры Kinescope грузим только когда до них доскроллили.
   autoplay=1&muted=1 — запуск без звука, звук включается кнопкой
   в самом плеере. autopause=1 — плеер сам ставится на паузу,
   если на странице запустился другой. */
function setupFrames(){
  const frames = Array.from(document.querySelectorAll(".vid iframe[data-src]"));
  if(!frames.length) return;

  if(frameObserver) frameObserver.disconnect();

  frameObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const f = en.target;
      f.src = f.dataset.src;
      f.removeAttribute("data-src");
      frameObserver.unobserve(f);
    });
  }, {threshold: 0.25});

  frames.forEach(f=>frameObserver.observe(f));
}

function setupVideos(){
  setupFrames();

  const vids = Array.from(document.querySelectorAll(".vid video"));
  if(!vids.length) return;

  if(vidObserver) vidObserver.disconnect();

  vidObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const v = en.target;
      if(en.isIntersecting){ v.play().catch(()=>{}); }
      else {
        v.pause();
        if(!v.muted){ v.muted = true; v.controls = false; v.closest(".vid").classList.remove("on"); }
      }
    });
  }, {threshold: 0.5});

  vids.forEach(v=>{
    /* Локального файла нет (например, папку с видео уже убрали
       из репозитория, а ID Kinescope ещё не вписан) — вместо
       чёрного прямоугольника показываем аккуратную заглушку. */
    v.addEventListener("error", ()=>{
      const box = v.closest(".vid");
      if(!box) return;
      const snd = box.querySelector(".snd");
      if(snd) snd.remove();
      const ph = document.createElement("div");
      ph.className = "vid-ph";
      ph.innerHTML = "<b>&#9654; Видео скоро появится</b>Ролик готовится к публикации";
      v.replaceWith(ph);
    });
    vidObserver.observe(v);
    v.addEventListener("click", ()=>{
      const box = v.closest(".vid");
      if(v.muted){
        vids.forEach(o=>{
          if(o !== v && !o.muted){
            o.muted = true; o.controls = false;
            o.closest(".vid").classList.remove("on");
          }
        });
        v.muted = false;
        v.controls = true;
        box.classList.add("on");
        v.play().catch(()=>{});
      } else {
        v.muted = true;
        v.controls = false;
        box.classList.remove("on");
      }
    });
  });
}

function go(id){ location.hash = id; }
window.addEventListener("hashchange", ()=> render(location.hash.slice(1) || "home"));
render(location.hash.slice(1) || "home");
</script>
