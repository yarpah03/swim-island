<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Цвет строки состояния и адресной строки в мобильных браузерах.
     Держать в одном тоне с --bg: иначе сверху остаётся чужая полоса. -->
<meta name="theme-color" content="#060B14">
<title>Плавательный остров VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ЦВЕТ — всё в одном месте
   ------------------------------------------------------------
   Раньше оттенки были рассыпаны по файлу в сорока с лишним местах,
   и смена фона означала сорок правок. Теперь ниже лежит вся палитра,
   а остальной файл на неё только ссылается. Хотите поменять
   настроение приложения — меняются числа здесь, и больше нигде.

   Палитра «морская глубина»: золото прежнее, подложка ушла из
   нейтрального чёрного в тёмно-синий. Золото от этого читается
   холоднее и дороже, хотя код цвета не изменился ни на единицу.
   ============================================================ */
:root{
  /* --- Золото. Три оттенка и два разложения в градиент --- */
  --gold:#B98A2E;                  /* основной */
  --gold-lt:#D0A445;               /* подсветка: наведение, иконки */
  --gold-dk:#7E5C1E;               /* приглушённый: подписи, стрелки */
  --gold-rgb:185,138,46;           /* то же число для полупрозрачных заливок */
  --hi-rgb:240,212,136;            /* светлый блик на кромке карточек */
  /* Золото читается металлом только на переходе: светлая кромка сверху,
     тёмная снизу. Один плоский цвет мозг видит как горчичный. */
  --gold-metal:linear-gradient(180deg,#F0D488 0%,#C79A3C 55%,#8A671F 100%);
  --gold-metal-dim:linear-gradient(180deg,#C9A24E 0%,#6E521B 100%);

  /* --- Подложка: страница и две ступени поверхностей --- */
  --bg:#060B14;
  --bg-rgb:6,11,20;                /* для шапки и затемнения под фотографией */
  --surf:#0C1422;
  --surf-2:#131E30;
  /* Заливка карточки: чуть светлее страницы, с уходом в тень к низу */
  --card-fill:linear-gradient(165deg,#141E30 0%,#0C1421 55%,#070C15 100%);
  /* Тёплое свечение сверху страницы */
  --glow:radial-gradient(120% 70% at 50% -12%, #16223A 0%, #0B1220 42%, var(--bg) 100%);

  /* --- Кромка карточки: блик в верхнем левом углу, затухание к нижнему правому --- */
  --gold-dim:rgba(var(--gold-rgb),.16);
  --gold-line:rgba(var(--gold-rgb),.30);
  --edge:linear-gradient(160deg,rgba(var(--hi-rgb),.42) 0%,rgba(var(--gold-rgb),.16) 38%,rgba(var(--gold-rgb),.05) 100%);
  --edge-soft:linear-gradient(160deg,rgba(var(--hi-rgb),.26) 0%,rgba(var(--gold-rgb),.11) 40%,rgba(var(--gold-rgb),.04) 100%);

  /* --- Текст: три ступени плюс подписи --- */
  --txt:#EDF1F6;
  --txt-2:#9BA7B8;
  --txt-3:#6A778A;
  /* Подписи под названиями: приглушённое золото вместо серого.
     Только для подписей — длинный текст этим цветом набирать нельзя. */
  --txt-sub:#B09563;

  /* --- Разделительные дорожки в игре. Как в настоящем бассейне:
         поплавки идут чередой, а не одним цветом --- */
  --lane-1:#EDF2F7;
  --lane-2:#2E6FD4;
  --lane-3:#CE4038;

  /* --- Тревожный цвет: ошибки и предупреждения. Единственный
         не-золотой акцент в приложении, поэтому и живёт отдельно --- */
  --warn:#B0472F;
  --warn-lt:#D2765C;

  /* --- Цвет вкладки. У каждой из пяти он свой: по нему видно, где ты
         находишься, ещё до того как прочитал заголовок. Значения ставит
         не эта строка, а paintTab() — здесь только запасной вариант на
         случай, если скрипт не отработал. Золото остаётся хозяином:
         оттенок вкладки живёт в фоне и в нижней панели, карточки его
         не трогают. --- */
  --ac:#C79A3C;
  --ac-rgb:199,154,60;

  /* Знак и название клуба. Единственное золото, которое не меняется
     при переходе между вкладками: логотип должен быть одним и тем же
     везде, иначе бренда не остаётся. */
  --brand:#B98A2E;
  --brand-metal:linear-gradient(180deg,#F0D488 0%,#C79A3C 55%,#8A671F 100%);

  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--txt);
  /* Снизу теперь висит панель вкладок, а под ней ещё полоса жеста.
     Если про них забыть, последняя строка уезжает под панель. */
  padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color:transparent;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* Тёплое свечение сверху: контент лежит в свете, а не висит в пустоте.
   Отдельным слоем, чтобы не тянуться за прокруткой. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:var(--glow);
}
/* Металлический перелив для коротких надписей и цифр */
.gold-metal{
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
/* Если браузер не умеет обрезать фон по буквам, текст стал бы невидимым.
   Возвращаем ему обычный золотой цвет. */
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .gold-metal,.wordmark,h2,.card .num,.row .idx{
    background:none;color:var(--gold);-webkit-text-fill-color:var(--gold)
  }
  .card .num,.row .idx{color:var(--gold-dk);-webkit-text-fill-color:var(--gold-dk)}
}
/* В альбомной ориентации вырез съедает край экрана — отступы считаем от него */
.wrap{
  max-width:1080px;margin:0 auto;
  padding-left:calc(20px + env(safe-area-inset-left, 0px));
  padding-right:calc(20px + env(safe-area-inset-right, 0px))
}

header{
  position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top, 0px);
  background:rgba(var(--bg-rgb),.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--gold-line);
}
/* Шапка. Знак и название стоят вместе по центру: логотип получает
   вес, которого у прижатого к углу значка не было, и при этом
   ничего не загораживает. */
.hd{display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 0}
/* Знак и название набраны --brand, а не --gold: на вкладке «Вода»
   всё остальное синеет, а логотип обязан остаться собой. */
.mark{width:38px;height:38px;flex:none;color:var(--brand)}
.mark path{fill:var(--brand)}
.wordmark{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:.12em;line-height:1.12;
  text-align:left;
  background:var(--brand-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.wordmark small{display:block;font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:.30em;color:var(--txt-3);margin-top:2px}
@media(max-width:420px){
  .hd{gap:10px;padding:11px 0}
  .mark{width:32px;height:32px}
  .wordmark{font-size:15.5px;letter-spacing:.11em}
}

/* ============================================================
   НИЖНЯЯ ПАНЕЛЬ
   ------------------------------------------------------------
   Пять вкладок вместо возврата к списку разделов. Панель висит
   поверх страницы, поэтому у body внизу отступ — иначе последняя
   строка прячется под ней.
   ============================================================ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;
  padding:7px 4px calc(9px + env(safe-area-inset-bottom, 0px));
  background:rgba(var(--bg-rgb),.93);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.07)
}
.tabbar button{
  flex:1;min-width:0;background:none;border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 1px;color:var(--txt-3);font-family:inherit;
  font-size:9.5px;font-weight:500;letter-spacing:0;line-height:1.3;
  -webkit-tap-highlight-color:transparent;
  transition:color .18s ease
}
.tabbar button svg{width:21px;height:21px;display:block;flex:none}
.tabbar button.on{color:var(--ac)}
.tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Шесть вкладок на узком экране: подписи ужимаем, значки оставляем.
   Ниже 330 пикселей подпись всё равно не читается — прячем её и
   оставляем один значок, это честнее обрезанного слова. */
@media(max-width:360px){ .tabbar button{font-size:9px} .tabbar button svg{width:20px;height:20px} }
@media(max-width:329px){ .tabbar button span{display:none} .tabbar button{padding:9px 1px} }

/* ============================================================
   ЛЕНТА «СЕГОДНЯ»
   ------------------------------------------------------------
   Главная перестала быть оглавлением. Сверху дата и крупное
   «Сегодня», под ним — то, что стоит открыть именно сейчас.
   Подборка считается от даты, поэтому меняется каждый день сама,
   без сервера и без ручной работы.
   ============================================================ */
.feed-day{
  font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt-3);padding-top:26px;margin-bottom:4px
}
.feed-h{
  font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  color:var(--txt);margin-bottom:22px
}
@media(max-width:420px){ .feed-h{font-size:30px} }

/* Главная карточка дня: фотография бассейна, поверх — что плыть */
.pick{
  display:block;width:100%;text-align:left;border:0;cursor:pointer;font-family:inherit;
  position:relative;overflow:hidden;border-radius:20px;
  min-height:196px;margin-bottom:12px;padding:0;
  background:var(--surf-2);
  -webkit-tap-highlight-color:transparent
}
.pick-photo{
  position:absolute;inset:0;
  background-image:url('hero-mobile.jpg');background-size:cover;background-position:center;
  opacity:.62
}
.pick-veil{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(var(--bg-rgb),.12) 0%,rgba(var(--bg-rgb),.62) 52%,rgba(var(--bg-rgb),.93) 100%)
}
.pick-in{position:relative;z-index:2;padding:110px 18px 18px}
.pick .k{
  font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ac);display:block;margin-bottom:8px
}
.pick .t{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:600;
  line-height:1.15;color:var(--txt);display:block;margin-bottom:7px
}
.pick .d{font-size:13.5px;line-height:1.5;color:var(--txt-2);display:block}

/* Обычная карточка ленты */
.fcard{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  border:1px solid transparent;border-radius:18px;padding:16px 17px;margin-bottom:11px;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box;
  -webkit-tap-highlight-color:transparent
}
.fcard .k{
  font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ac);display:block;margin-bottom:8px;opacity:.9
}
.fcard .t{
  font-size:16.5px;font-weight:600;line-height:1.32;color:var(--txt);
  display:block;margin-bottom:5px
}
.fcard .d{font-size:13px;line-height:1.5;color:var(--txt-2);display:block}
.fcard .go{
  display:inline-block;margin-top:12px;font-size:12.5px;font-weight:500;
  color:var(--gold);letter-spacing:.02em
}

/* Три цифры под заголовком раздела — сколько всего внутри */
.nums{display:flex;gap:9px;margin-bottom:22px}
.nums div{
  flex:1;min-width:0;border:1px solid transparent;border-radius:16px;padding:14px 12px;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box
}
.nums b{
  display:block;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:30px;font-weight:600;line-height:1;color:var(--ac)
}
.nums span{
  display:block;font-size:10.5px;line-height:1.35;color:var(--txt-3);margin-top:7px
}
@media(max-width:360px){ .nums b{font-size:25px} .nums span{font-size:9.5px} }

/* Новость клуба. Отличается от карточки-ссылки тем, что её читают
   целиком прямо здесь, а кнопка — необязательное продолжение. */
.ncard{
  border:1px solid transparent;border-radius:18px;padding:17px 18px;margin-bottom:12px;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box
}
.ncard .nimg{
  display:block;width:calc(100% + 36px);margin:-17px -18px 15px;
  border-radius:18px 18px 0 0;object-fit:cover
}
.ncard .k{
  display:block;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ac);margin-bottom:9px;opacity:.9
}
.ncard .t{
  display:block;font-family:'Cormorant Garamond',Georgia,serif;
  font-size:23px;font-weight:600;line-height:1.2;color:var(--txt);margin-bottom:10px;
  text-wrap:balance
}
.ncard .d{display:block;font-size:14px;line-height:1.6;color:var(--txt-2);margin-bottom:9px}
.ncard .go{
  display:inline-block;margin-top:5px;cursor:pointer;font-family:inherit;
  padding:11px 17px;border-radius:var(--r);border:1px solid var(--gold-line);
  background:rgba(var(--gold-rgb),.09);color:var(--gold-lt);font-size:14.5px;
  transition:background .18s;-webkit-tap-highlight-color:transparent
}
.ncard .go:hover{background:rgba(var(--gold-rgb),.16)}

/* Пост канала. Виджет телеграма приходит своей рамкой и сам подбирает
   высоту, поэтому фиксировать её нельзя — задаём только поля и минимум
   на время загрузки, чтобы экран не прыгал. */

/* Выбор уровня подготовки */
.lvls{display:flex;flex-direction:column;gap:11px;margin:6px 0 26px}
.lvl{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  border:1px solid transparent;border-radius:18px;padding:16px 17px;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box;
  -webkit-tap-highlight-color:transparent
}
.lvl.on{background:var(--card-fill) padding-box, var(--edge) border-box}
.lvl-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.lvl-h b{font-size:17px;font-weight:600;color:var(--txt)}
.lvl-h i{font-style:normal;font-size:12.5px;color:var(--gold-dk);margin-left:auto;white-space:nowrap}
.lvl-s{display:block;font-size:13px;line-height:1.5;color:var(--txt-2)}
.lvl-now{
  display:inline-block;margin-top:11px;font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold-line);border-radius:20px;padding:5px 11px
}
/* Подпись под карточкой дня: по какому уровню она подобрана */
.lvl-note{
  font-size:12px;color:var(--txt-3);margin:-4px 0 16px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.lvl-note a{color:var(--gold);cursor:pointer;text-decoration:none;padding:4px 0}
.lvl-note a:hover{color:var(--gold-lt)}

.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:22px 0 6px;font-size:13px;color:var(--txt-3)}
/* Крошки — навигация, в них целятся пальцем: даём им высоту */
.crumb a{color:var(--gold);text-decoration:none;cursor:pointer;padding:6px 0;display:inline-block}
.crumb a:hover{color:var(--gold-lt)}
.crumb span.sep{color:var(--txt-3)}

/* ============================================================
   ЗАГОЛОВКИ РАЗНОЙ ДЛИНЫ
   ------------------------------------------------------------
   «Кроль» и «1500 упражнений для моделирования круговой тренировки»
   — это один и тот же h1, но при кегле 38 пикселей второй заголовок
   разваливается на телефоне в четыре строки крупного серифа и давит
   всё остальное на экране.

   Поэтому кегль зависит от длины: класс ставит render() по числу
   знаков. Плюс text-wrap:balance — браузер разбивает заголовок на
   строки примерно равной длины, а не оставляет одно слово болтаться
   в последней строке. Где его не понимают, всё просто останется
   как было.
   ============================================================ */
h1{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
  font-size:clamp(27px, 8.4vw, 38px);letter-spacing:.01em;line-height:1.15;
  margin:6px 0 10px;text-wrap:balance;overflow-wrap:break-word;hyphens:manual
}
h1.long {font-size:clamp(24px, 7.2vw, 33px);line-height:1.18}
h1.xlong{font-size:clamp(21px, 6.1vw, 28px);line-height:1.24;letter-spacing:.005em}
.lede{color:var(--txt-sub);font-size:16px;max-width:660px;margin-bottom:30px}
h2{
  font-size:12.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  margin:38px 0 16px;display:flex;align-items:center;gap:10px;
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
h2::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(var(--gold-rgb),.35),transparent)
}

.hero{position:relative;padding:0;border:0;margin:0 -20px 8px;overflow:hidden}
.hero-in{position:relative;padding:64px 20px 30px;z-index:2}
.hero-photo{
  position:absolute;inset:0;z-index:0;
  background-image:url('hero.jpg');
  background-size:cover;background-position:center 58%;
}
@media(max-width:700px){.hero-photo{background-image:url('hero-mobile.jpg')}}
.hero-veil{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(var(--bg-rgb),.30) 0%,rgba(var(--bg-rgb),.52) 44%,rgba(var(--bg-rgb),.88) 82%,var(--bg) 100%);
}
.hero-waves{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:2;pointer-events:none}
.hero .mark-big{width:70px;height:70px;margin-bottom:18px;display:block}
.hero h1{font-size:46px;margin-bottom:12px}
.hero .lede{margin-bottom:24px;color:var(--txt-2)}
.hero-note{font-size:11px;letter-spacing:.14em;color:var(--txt-3);margin-bottom:14px}
@media(max-width:600px){
  .hero{margin:0 -15px 8px}
  .hero-in{padding:42px 15px 22px}
  .hero h1{font-size:31px}
  .hero .mark-big{width:54px;height:54px}
}

/* Описание клуба на главной */
.about{max-width:700px;margin-bottom:8px}
.about p{margin:0 0 14px;font-size:15.5px;line-height:1.7;color:var(--txt-2)}
.facts{display:flex;flex-direction:column;gap:2px}
.fact{
  display:flex;align-items:center;gap:20px;
  padding:17px 0;border-bottom:1px solid rgba(var(--gold-rgb),.12)
}
.fact:last-child{border-bottom:0}
.fact-n{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
  font-size:48px;line-height:1.15;letter-spacing:0;
  min-width:118px;flex:none;text-align:right;white-space:nowrap;
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.fact-t{flex:1;font-size:15px;line-height:1.55;color:var(--txt-2)}
@media(max-width:600px){
  .about p{font-size:15px}
  .fact{gap:14px;padding:14px 0}
  .fact-n{font-size:36px;min-width:88px}
  .fact-t{font-size:14px}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}

.card{
  -webkit-user-select:none;user-select:none;
  border:1px solid transparent;border-radius:var(--r);
  background:var(--card-fill) padding-box, var(--edge) border-box;
  padding:20px 20px 18px;cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  display:flex;flex-direction:column;gap:7px;text-align:left;color:inherit;font:inherit;width:100%;
}
.card:hover{
  transform:translateY(-2px);
  background:var(--card-fill) padding-box, linear-gradient(160deg,rgba(var(--hi-rgb),.75) 0%,rgba(var(--gold-rgb),.28) 40%,rgba(var(--gold-rgb),.10) 100%) border-box;
  box-shadow:0 10px 26px rgba(0,0,0,.45)
}
.card:active{transform:translateY(0) scale(.985)}
.card .num{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;line-height:1;letter-spacing:.02em;
  background:var(--gold-metal-dim);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.card .ttl{
  font-size:16px;font-weight:500;color:var(--txt);margin-top:4px;
  text-transform:uppercase;letter-spacing:.09em;line-height:1.35;
  text-wrap:balance;overflow-wrap:break-word
}
/* Прописные съедают ширину быстрее строчных, поэтому длинному
   названию карточки капитель только вредит — снимаем её. */
.card .ttl.long{
  text-transform:none;letter-spacing:.02em;font-size:15.5px;line-height:1.3
}
.card .sub{font-size:13.5px;color:var(--txt-sub);line-height:1.55}
.card .meta{
  align-self:flex-start;margin-top:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold-lt);background:rgba(var(--gold-rgb),.12);border-radius:20px;padding:4px 11px
}

.row{
  -webkit-user-select:none;user-select:none;
  display:flex;align-items:center;gap:18px;
  border:1px solid transparent;border-radius:10px;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box;
  padding:16px 20px;cursor:pointer;transition:transform .16s ease, background .18s ease;
  text-align:left;color:inherit;font:inherit;width:100%;
}
.row:hover{background:var(--card-fill) padding-box, var(--edge) border-box}
.row:active{transform:scale(.99)}
/* Номер — часть оформления, а не подпись: крупная приглушённая цифра */
.row .idx{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;line-height:1;
  min-width:42px;flex:none;letter-spacing:.02em;
  background:var(--gold-metal-dim);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;opacity:.75
}
.row .idx.small{font-size:19px;color:rgba(var(--gold-rgb),.45);min-width:auto}
.row .body{flex:1;min-width:0}
.row .name{font-size:16.5px;font-weight:500;letter-spacing:.01em;
  text-wrap:balance;overflow-wrap:break-word}
/* Длинное название в списке набираем мельче и плотнее: иначе одна
   строка списка вырастает вдвое выше соседних и ряд рассыпается. */
.row .name.long{font-size:15px;letter-spacing:0;line-height:1.35}
/* Короткая справка идёт прописными и не спорит с названием.
   Длинную оставляем обычным набором — капитель на фразу нечитаема. */
.row .note{
  display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-dk);margin-top:5px;line-height:1.45
}
.row .note.long{text-transform:none;letter-spacing:.01em;font-size:13px;color:var(--txt-sub);line-height:1.5}
.row .chev{color:var(--gold-dk);font-size:18px;line-height:1;flex:none}
@media(max-width:600px){
  .row{gap:14px;padding:15px 16px}
  .row .idx{font-size:28px;min-width:34px}
  .row .name{font-size:15.5px}
}
.rows{display:flex;flex-direction:column;gap:8px}

.pill{display:inline-block;font-size:11.5px;letter-spacing:.06em;color:var(--gold);background:var(--gold-dim);border-radius:20px;padding:4px 12px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}

.slot{
  border:1px dashed rgba(var(--gold-rgb),.34);border-radius:var(--r);
  padding:30px 22px;text-align:center;color:var(--txt-3);font-size:14px;background:rgba(var(--gold-rgb),.03)
}
.slot b{display:block;color:var(--gold);font-weight:500;font-size:15px;margin-bottom:6px;letter-spacing:.02em}

/* Пока идёт заплыв, страница не ездит. Одного overflow:hidden на телефонах
   не хватает, поэтому фиксируем страницу целиком. */
body.noscroll{
  position:fixed;top:0;left:0;width:100%;height:100%;
  overflow:hidden;overscroll-behavior:none;
  padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px))
}
body.noscroll .gamebox canvas{height:min(calc(var(--vh, 100vh) * 0.56), 420px)}

/* Игра. Холст занимает всю ширину, высота держится пропорцией,
   но не выше половины экрана — иначе на телефоне под ним ничего не видно. */
.gamebox{
  position:relative;max-width:760px;margin-bottom:26px;
  border:1px solid transparent;border-radius:var(--r);overflow:hidden;
  background:var(--card-fill) padding-box, var(--edge) border-box
}
.gamebox canvas{
  display:block;width:100%;height:min(calc(var(--vh, 100vh) * 0.58), 440px);
  touch-action:none;cursor:pointer      /* иначе тап прокручивает страницу */
}
.g-hud{
  position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  padding:12px 16px;pointer-events:none;
  font-size:13px;letter-spacing:.08em;text-transform:uppercase
}
.g-hud span:first-child{color:var(--gold-lt);font-weight:500}
.g-hud span:last-child{color:var(--gold-dk)}

/* Квадратное дыхание. Холст держим квадратным: шарик ходит по сторонам,
   и на вытянутом прямоугольнике «вдох» стал бы длиннее «задержки»
   визуально, хотя по времени они равны. */
.breathbox{
  position:relative;max-width:520px;margin:0 auto 18px;
  border:1px solid transparent;border-radius:var(--r);overflow:hidden;
  background:var(--card-fill) padding-box, var(--edge) border-box
}
.breathbox canvas{
  display:block;width:100%;aspect-ratio:1/1;
  max-height:min(calc(var(--vh, 100vh) * 0.52), 480px)
}
.brow{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  max-width:520px;margin:0 auto 12px
}
.bplay{
  flex:1 1 150px;cursor:pointer;font-family:inherit;
  padding:14px 20px;border-radius:var(--r);border:1px solid var(--gold-line);
  background:rgba(var(--gold-rgb),.10);color:var(--gold-lt);
  font-size:16px;letter-spacing:.02em;transition:background .18s;
  -webkit-tap-highlight-color:transparent
}
.bplay:hover{background:rgba(var(--gold-rgb),.18)}
.bsec{display:flex;gap:6px;flex:0 0 auto}
.bsec button{
  cursor:pointer;font-family:inherit;font-size:14px;
  padding:12px 13px;border-radius:10px;
  border:1px solid rgba(255,255,255,.10);background:transparent;color:var(--txt-3);
  -webkit-tap-highlight-color:transparent
}
.bsec button.on{border-color:var(--gold-line);color:var(--gold-lt);background:rgba(var(--gold-rgb),.10)}
.bcnt{
  max-width:520px;margin:0 auto 26px;font-size:13px;color:var(--txt-3);text-align:center
}
.bcnt b{color:var(--gold-lt);font-weight:500}

/* Личный рекорд в игре */
.bestv{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;line-height:1.15;
  background:var(--gold-metal);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent
}
.bestv.empty{
  font-family:inherit;font-size:15px;line-height:1.5;color:var(--txt-2);
  -webkit-text-fill-color:var(--txt-2)
}

/* Персональная ссылка приглашения */
.refbox{
  border:1px solid transparent;border-radius:var(--r);padding:20px 22px;
  background:var(--card-fill) padding-box, var(--edge) border-box
}
.ref-t{
  display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-dk);margin-bottom:12px
}
/* Ссылка длинная и её будут выделять руками — даём моноширинный набор
   и разрешаем перенос в любом месте, иначе она вылезет за экран. */
.ref-v{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.5;color:var(--gold-lt);
  word-break:break-all;user-select:all;margin-bottom:16px
}
.refbox.off .ref-v{
  font-family:inherit;font-size:14.5px;color:var(--txt-2);
  word-break:normal;user-select:auto;margin-bottom:0
}
.refbox.off .ref-b{display:none}
.ref-b{display:flex;gap:10px;flex-wrap:wrap}
.ref-btn{
  font:inherit;font-size:13.5px;letter-spacing:.03em;cursor:pointer;
  min-height:44px;padding:10px 18px;border-radius:9px;color:var(--gold-lt);
  border:1px solid var(--gold-line);background:rgba(var(--gold-rgb),.07);
  transition:background .18s, border-color .18s
}
.ref-btn:hover{background:rgba(var(--gold-rgb),.14);border-color:var(--gold)}
.ref-btn:active{transform:scale(.98)}

/* Соцсети под главным экраном: три одинаковые карточки в ряд,
   на узком экране переносятся и остаются по центру. */
.soc{
  margin-top:46px;padding-top:28px;text-align:center;
  border-top:1px solid rgba(var(--gold-rgb),.16)
}
.soc-t{
  display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-dk);margin-bottom:18px
}
.soc-r{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.soc-b{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  min-width:104px;padding:17px 20px;cursor:pointer;font:inherit;color:inherit;
  border:1px solid transparent;border-radius:var(--r);
  background:var(--card-fill) padding-box, var(--edge-soft) border-box;
  transition:transform .16s ease, background .18s ease
}
.soc-b:hover{
  transform:translateY(-2px);
  background:var(--card-fill) padding-box, var(--edge) border-box
}
.soc-b:active{transform:translateY(0) scale(.97)}
.soc-i{width:26px;height:26px;color:var(--gold-lt);display:block}
.soc-i svg{width:100%;height:100%;display:block}
.soc-n{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-dk)}
@media(max-width:420px){
  .soc-r{gap:9px}
  .soc-b{min-width:0;flex:1;padding:15px 10px}
}

/* Узкие телефоны: 320 точек ширины, из них 30 съедают поля */
@media(max-width:380px){
  h1{font-size:26px}
  .hero h1{font-size:28px}
  .lede{font-size:15px}
  .card{padding:17px 16px 15px}
  .card .ttl{font-size:15px;letter-spacing:.07em}
  .grid{grid-template-columns:1fr}
  .fact-n{font-size:31px;min-width:74px}
  .book-cover{width:112px}
  .book-m{gap:10px}
  .book-m b{font-size:13px}
  .dl{padding:14px 16px;gap:12px}
  .soc-n{font-size:10.5px;letter-spacing:.06em}
  .bestv{font-size:38px}
}

/* Страница книги: обложка слева, выходные данные справа, под ними — скачивание.
   На узком экране обложка встаёт по центру и колонки складываются. */
.book{max-width:760px;margin-bottom:30px}
.book-top{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.book-cover{
  width:154px;flex:none;border-radius:6px;display:block;
  border:1px solid var(--gold-line);
  /* Скан лежит на белом, поэтому подкладываем тень, иначе он висит пятном */
  box-shadow:0 10px 26px rgba(0,0,0,.55), 0 0 0 4px rgba(var(--gold-rgb),.05)
}
.book-meta{flex:1;min-width:210px;display:flex;flex-direction:column;gap:1px}
.book-m{
  display:flex;gap:14px;align-items:baseline;justify-content:space-between;
  padding:9px 0;border-bottom:1px solid rgba(var(--gold-rgb),.13)
}
.book-m:last-child{border-bottom:0}
.book-m span{
  font-size:11px;letter-spacing:.10em;text-transform:uppercase;
  color:var(--gold-dk);flex:none
}
.book-m b{font-weight:400;font-size:14.5px;color:var(--txt);text-align:right;line-height:1.35}

/* Где взять книгу. Раньше на этом месте была кнопка скачивания. */
.buy{
  margin-top:22px;padding:18px 20px;border-radius:var(--r);
  border:1px solid transparent;
  background:var(--card-fill) padding-box, var(--edge-soft) border-box
}
.buy-t{
  font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:9px
}
.buy-p{font-size:14px;line-height:1.55;color:var(--txt-2);margin-bottom:15px}
.buy-r{display:flex;gap:9px;flex-wrap:wrap}
.buy-b{
  flex:1 1 auto;min-width:104px;cursor:pointer;font-family:inherit;
  padding:12px 16px;border-radius:var(--r);border:1px solid var(--gold-line);
  background:rgba(var(--gold-rgb),.07);color:var(--gold-lt);
  font-size:14.5px;letter-spacing:.02em;transition:background .18s;
  -webkit-tap-highlight-color:transparent
}
.buy-b:hover{background:rgba(var(--gold-rgb),.14)}
@media(max-width:560px){
  .book-cover{width:126px}
  .book-m b{font-size:13.5px}
}

.err{background:var(--surf);border-left:3px solid var(--warn);border-radius:0;padding:14px 17px;font-size:14px;color:var(--txt-2);margin:16px 0}
.err b{color:var(--warn-lt);font-weight:500}
.tipbox{background:var(--surf);border-left:3px solid var(--gold);border-radius:0;padding:14px 17px;font-size:14px;color:var(--txt-2);margin:16px 0}
.tipbox b{color:var(--gold);font-weight:500}

.lesson{max-width:760px}
.lesson .intro{background:var(--surf);border:1px solid rgba(var(--gold-rgb),.16);border-radius:var(--r);padding:20px 22px;margin-bottom:8px;color:var(--txt-2);font-size:15px;line-height:1.65}
.ex{margin:30px 0 0}
.ex-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.ex-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--gold-dk);line-height:1;min-width:34px}
.ex-t{font-size:21px;font-weight:500;letter-spacing:.01em;color:var(--txt)}
.goal,.hint{display:flex;gap:11px;padding:13px 16px;border-radius:10px;font-size:14.5px;line-height:1.6;margin-bottom:9px}
.goal{background:rgba(var(--gold-rgb),.07);border-left:3px solid var(--gold)}
.hint{background:var(--surf);border-left:3px solid var(--gold-dk)}
.goal i,.hint i{font-style:normal;color:var(--gold);flex:none;font-size:15px}
.goal b,.hint b{color:var(--gold);font-weight:500}
.goal span,.hint span{color:var(--txt-2)}
.vid{margin:14px 0 0;border-radius:10px;overflow:hidden;background:#000;border:1px solid rgba(var(--gold-rgb),.2)}
.vid video{width:100%;display:block;background:#000}
.vid-cap{padding:9px 14px;font-size:12.5px;color:var(--txt-3);letter-spacing:.03em;background:var(--surf)}
.vid{position:relative}
.vid .frame{position:relative;padding-top:56.25%;width:100%;background:#000}
.vid .frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
.vid-ph{
  aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:rgba(var(--gold-rgb),.04);color:var(--txt-3);font-size:13px;text-align:center;padding:20px
}
.vid-ph b{color:var(--gold);font-weight:500;font-size:15px;letter-spacing:.02em}
.snd{
  position:absolute;right:10px;top:10px;z-index:3;
  display:flex;align-items:center;gap:7px;
  background:rgba(var(--bg-rgb),.72);backdrop-filter:blur(6px);
  border:1px solid rgba(var(--gold-rgb),.4);border-radius:20px;
  padding:6px 13px;font-size:12px;color:var(--gold);
  cursor:pointer;pointer-events:none;transition:opacity .25s;letter-spacing:.02em
}
.vid.on .snd{opacity:0}
.vid video{cursor:pointer}
/* Тренировки: карточка + золотой разделитель между ними */
.wks{max-width:780px}
.wk{
  background:var(--surf);border:1px solid rgba(var(--gold-rgb),.16);
  border-radius:var(--r);overflow:hidden
}
.wk-h{
  display:flex;align-items:center;gap:12px;
  padding:13px 20px;background:rgba(var(--gold-rgb),.07);
  border-bottom:1px solid rgba(var(--gold-rgb),.18)
}
.wk-n{
  font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);flex:1
}
.wk-v{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;
  color:var(--gold-lt);letter-spacing:.03em;flex:none
}
.wk-i{margin:0;padding:16px 20px 18px 20px;list-style:none;counter-reset:wkstep}
.wk-i li{
  counter-increment:wkstep;position:relative;
  padding:0 0 0 30px;margin-bottom:11px;
  font-size:14.5px;line-height:1.6;color:var(--txt-2)
}
.wk-i li:last-child{margin-bottom:0}
.wk-i li::before{
  content:counter(wkstep);position:absolute;left:0;top:1px;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;
  color:var(--gold-dk);line-height:1.5
}
.wk-sep{display:flex;align-items:center;gap:16px;margin:26px 0}
.wk-sep::before,.wk-sep::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--gold-rgb),.42),transparent)
}
.wk-sep svg{width:20px;height:20px;flex:none;opacity:.6}

/* Одна тренировка целиком: разбор, серии, подсказки */
.one{max-width:780px}
.story{
  background:var(--surf);border:1px solid rgba(var(--gold-rgb),.16);border-radius:var(--r);
  padding:20px 22px;margin-bottom:8px;color:var(--txt-2);font-size:15px;line-height:1.65
}
.sets{margin-top:2px}
.set{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid rgba(var(--gold-rgb),.10)}
.set:last-child{border-bottom:0}
.set-v{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:var(--gold);
  min-width:64px;flex:none;text-align:right;letter-spacing:.02em;padding-top:1px
}
.set-t{flex:1;min-width:0;font-size:14.5px;line-height:1.6;color:var(--txt-2)}
.set-hint{
  display:block;margin-top:9px;padding:10px 14px;border-left:2px solid var(--gold-dk);
  background:rgba(var(--gold-rgb),.05);font-size:13.5px;line-height:1.55;color:var(--txt-3)
}
.set-hint b{color:var(--gold-dk);font-weight:500}
.sets.novol .set-v{display:none}
.sets.novol .set{gap:0}
.safebox{
  background:var(--surf);border-left:3px solid var(--warn);
  padding:14px 17px;font-size:14px;line-height:1.6;color:var(--txt-2);margin:22px 0 0
}
.safebox b{color:var(--warn-lt);font-weight:500}

/* Текстовая страница: упражнение, ошибка, поворот, часть теории */
.doc{max-width:760px}
.doc h3{
  font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;
  color:var(--txt);letter-spacing:.01em;margin:28px 0 10px
}
.doc p{margin:0 0 12px;font-size:15px;line-height:1.7;color:var(--txt-2)}
.doc ul,.doc ol{margin:0 0 14px;padding:0;list-style:none;counter-reset:docstep}
.doc li{
  position:relative;padding-left:26px;margin-bottom:10px;
  font-size:14.5px;line-height:1.65;color:var(--txt-2)
}
.doc li:last-child{margin-bottom:0}
.doc ul li::before{
  content:"";position:absolute;left:6px;top:10px;
  width:5px;height:5px;border-radius:50%;background:var(--gold-dk)
}
.doc ol li{counter-increment:docstep;padding-left:30px}
.doc ol li::before{
  content:counter(docstep);position:absolute;left:0;top:0;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:var(--gold-dk)
}

/* ============================================================
   ПЯТЬ ВКЛАДОК
   ------------------------------------------------------------
   Раньше в любой раздел ходили через список из восьми плиток на
   главной. Теперь снизу висит панель: пять мест, до которых
   всегда один палец, а восемь разделов разложены по ним.

   to  — экран, который открывает вкладка
   g   — цвет фона вверху страницы
   hdr — цвет полосы телеграма: он должен совпасть с верхом фона,
         иначе сверху видна чужая ступенька
   ac  — цвет самой вкладки в панели и подписей в ленте
   ph  — снимок в верхней полосе экрана. Есть не у всех: у «Сегодня»
         фотография уже стоит на карточке дня, вторая под ней сделала бы
         кашу, а «Ещё» — служебный экран, ему картинка не нужна

   Цвет вкладки — это не один оттенок, а целый набор: им набраны
   заголовки разделов, номера на карточках, кромка карточек, крошки,
   ссылки и подписи. Иначе вкладки отличались бы только фоном, а всё
   написанное на них оставалось бы одинаковым.

   base — основной, lt — светлый (наведение, значки), dk — приглушённый
   (номера, стрелки), rgb — он же числами для полупрозрачных заливок,
   hi — блик на верхней кромке карточки, sub — цвет подводок под
   заголовками. Тот же смысл, что у золота в палитре наверху: набор
   просто подменяется целиком при переходе на другую вкладку.

   «Сегодня» и «Книги» набраны исходным золотом — цифры в них те же,
   что в :root, поэтому эти две вкладки выглядят как раньше.

/* ============================================================
   УРОВЕНЬ ПОДГОТОВКИ
   ------------------------------------------------------------
   Тренировка дня одна, а плавают все по-разному: 1200 метров и
   4600 — это разные виды спорта. Поэтому при первом открытии
   спрашиваем уровень один раз и дальше подбираем занятие под него.

   Буква уровня — это последняя часть идентификатора экрана:
   sk_n_11 лежит в sk_n, то есть «Скорость, новичок». Так устроены
   все направления и вся выносливость, поэтому отбирать тренировки
   можно прямо по имени, ничего не размечая заново.
   ============================================================ */
const LEVELS = [
  {id:"n", n:"Новичок", vol:"1200–1600 м",
   s:"Плаваю недавно или редко. Задача — доплыть ровно, а не быстро."},
  {id:"s", n:"Средний", vol:"2200–2800 м",
   s:"Плаваю регулярно, держу темп на дистанции и умею считать отдых."},
  {id:"p", n:"Продвинутый", vol:"4000–4600 м",
   s:"Плаваю давно и много, работаю по интервалу с коротким отдыхом."}
];
const LVL_KEY = "swim_level";
let LEVEL = null;

const isLvl = v => LEVELS.some(l => l.id === v);
const cloud = () => {
  const tg = window.Telegram && window.Telegram.WebApp;
  return tg && tg.CloudStorage ? tg.CloudStorage : null;
};

/* Память устройства читается мгновенно, а облако — с задержкой. Поэтому
   сначала показываем то, что знаем, и только потом, когда ответит облако,
   при необходимости перерисовываем. Иначе первый экран мигал бы. */
function loadLevel(){
  try{ const v = localStorage.getItem(LVL_KEY); if(isLvl(v)) LEVEL = v; }catch(e){}
}
function saveLevel(v){
  if(!isLvl(v)) return;
  LEVEL = v;
  try{ localStorage.setItem(LVL_KEY, v); }catch(e){}
  const cs = cloud();
  try{ if(cs && cs.setItem) cs.setItem(LVL_KEY, v, ()=>{}); }catch(e){}
}
/* Спрашиваем облако телеграма: там уровень лежит рядом с человеком, а не
   с телефоном, поэтому переезжает на новое устройство сам. Если в облаке
   пусто, а на устройстве уровень есть — переносим его туда. */
function syncLevel(){
  const cs = cloud();
  if(!cs || !cs.getItem) return;
  try{
    cs.getItem(LVL_KEY, (err, v)=>{
      if(err) return;
      if(isLvl(v)){
        if(v !== LEVEL){
          LEVEL = v;
          try{ localStorage.setItem(LVL_KEY, v); }catch(e){}
          render(location.hash.slice(1) || "home");
        }
      } else if(LEVEL && cs.setItem){
        cs.setItem(LVL_KEY, LEVEL, ()=>{});
      }
    });
  }catch(e){}
}
// Выбор уровня — из разметки, поэтому функция должна быть видна снаружи
function pickLevel(v){
  saveLevel(v);
  const tg = window.Telegram && window.Telegram.WebApp;
  try{ if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); }catch(e){}
  render(location.hash.slice(1) || "home");
  if(typeof window !== "undefined" && window.scrollTo) window.scrollTo({top:0,behavior:"instant"});
}

  L.blocks.forEach(b=>{
    const id = lvl + "_" + b.n;
    T[id] = {
      title: "Блок № " + b.n + ". " + b.t,
      lede: b.sub,
      pills: [L.level, b.w.length + " тренировок"],
      workouts: b.w
    };
    PARENT[id] = lvl;
  });
});

/* Скорость, мощность и восстановление устроены иначе: там нет блоков,
   а есть пятнадцать самостоятельных тренировок на каждом уровне.
   Путь: направление → уровень → список тренировок → одна тренировка. */
const LSUB = {
  "Новичок":     "Отрезки короче и отдыха больше — сначала учимся делать чисто, потом быстро",
  "Средний":     "Работа по интервалу: отдых считается по часам, а не берётся по ощущениям",
  "Продвинутый": "Полный объём и минимальный отдых — для тех, кто плавает регулярно и давно"
};

Object.keys(BLOCKS).forEach(dir=>{
  const D = BLOCKS[dir];
  const lvls = Object.keys(D.levels);

  T[dir] = {
    title: D.name,
    lede: D.lede + " Выберите уровень.",
    kids: lvls.map((k,i)=>{
      const L = D.levels[k];
      return {
        id: k, n: "0" + (i+1), t: L.level, s: LSUB[L.level],
        m: L.vol + " · " + L.w.length + " тренировок"
      };
    })
  };

  lvls.forEach(k=>{
    const L = D.levels[k];
    T[k] = {
      title: D.name + ". " + L.level,
      lede: "Пятнадцать готовых тренировок. Порядок свободный — берите ту, что подходит по задаче.",
      pills: [L.level, L.vol + " за занятие"],
      slot: false,
      rows: L.w.map(w=>[String(w.n), "Тренировка " + w.n, w.note, k + "_" + w.n])
    };
    PARENT[k] = dir;

    L.w.forEach(w=>{
      const id = k + "_" + w.n;
      T[id] = {
        title: "Тренировка " + w.n,
        pills: [D.name, L.level, w.vol + " м"],
        one: w
      };
      PARENT[id] = k;
    });
  });
});

/* Раздел «Обучение»: упражнения по стилям, типичные ошибки,
   старты и повороты. Экраны собираются из obuchenie.js. */
// «21 упражнение», но «22 упражнения» и «18 упражнений» — считаем сами,
// чтобы подписи не разъезжались с содержимым при любой правке данных.
function plural(n, forms){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return n + " " + forms[2];
  if(b > 1 && b < 5) return n + " " + forms[1];
  if(b === 1) return n + " " + forms[0];
  return n + " " + forms[2];
}
const nDrills = n => plural(n, ["упражнение","упражнения","упражнений"]);
const nErrors = n => plural(n, ["ошибка","ошибки","ошибок"]);

(function(){
  const put = (id, screen, parent)=>{ T[id] = screen; if(parent) PARENT[id] = parent; };

  // Совершенствование техники: стиль → список упражнений → упражнение
  T.s1_2.rows = [];
  UCH.drills.forEach((g,i)=>{
    T.s1_2.rows.push([String(i+1).padStart(2,"0"), g.name, nDrills(g.items.length), g.key]);
    put(g.key, {
      title: g.name + ". Упражнения",
      lede: "Техническая работа для тех, кто уже держится на воде и хочет плыть длиннее и легче.",
      pills: [nDrills(g.items.length)],
      slot: false,
      rows: g.items.map(x=>[String(x.n), x.title, x.cat, g.key + "_" + x.n])
    }, "s1_2");
    g.items.forEach(x=>put(g.key + "_" + x.n, {
      title: x.title, pills: [g.name, x.cat, x.level], doc: x.doc
    }, g.key));
  });

  // Типичные ошибки: стиль → список ошибок → разбор ошибки
  UCH.errors.forEach((g,i)=>{
    const k = T.s1_4.kids[i];
    if(k){ k.s = nErrors(g.items.length) + ": почему возникают, как выглядят правильно и чем лечатся"; k.m = ""; }
    put(g.key, {
      title: "Ошибки: " + g.name.toLowerCase(),
      lede: "Самые частые ошибки любителя. У каждой — почему она возникает и чем её исправить.",
      pills: [nErrors(g.items.length)],
      slot: false,
      rows: g.items.map(x=>[String(x.n), x.title, "", g.key + "_" + x.n])
    }, "s1_4");
    g.items.forEach(x=>put(g.key + "_" + x.n, {
      title: x.title, pills: [g.name, "Ошибка " + x.n], lead: x.lead, doc: x.doc
    }, g.key));
  });

  // Внутри сплошной страницы заголовки опускаем на уровень ниже,
  // иначе разделы упражнения спорят с заголовком самого упражнения.
  const demote = doc => doc.map(([t,v])=> t === "h2" ? ["h3", v] : (t === "h3" ? ["h4", v] : [t, v]));

  // Обучение с нуля → Старты: вся теория одной страницей, без упражнений
  const S = UCH.starts;
  put("st0", {
    title: "Стартовый прыжок",
    lede: "Поэтапное обучение с нуля для взрослых — от первого спада в воду до старта с тумбы.",
    pills: [plural(S.theory.length,["часть","части","частей"])],
    doc: S.theory.reduce((acc,p)=>acc.concat([["h2", p.title]], demote(p.doc)), [])
  }, "s1_1");

  // Обучение с нуля → Повороты: список, у каждого поворота своя страница
  const V = UCH.turns;
  put("tn0", {
    title: "Повороты",
    lede: "Одиннадцать поворотов: где применяется, что говорят правила, за что снимают и как учить.",
    pills: [plural(V.list.length,["поворот","поворота","поворотов"])],
    slot: false,
    rows: V.list.map(x=>[String(x.n), x.title, x.note, "tn_" + x.n])
  }, "s1_1");
  V.list.forEach(x=>put("tn_" + x.n, {
    title: x.title, pills: ["Поворот " + x.n, x.level], lead: x.lead, doc: x.doc
  }, "tn0"));

  // Отработка элементов → упражнения, вынесенные из уроков
  put("st_d0", {
    title: "Старты — упражнения",
    lede: "Упражнения на отработку стартового прыжка: перенос веса, отталкивание, управление телом в полёте. Теория и этапы обучения с нуля — в разделе «Обучение с нуля».",
    pills: [nDrills(S.drills.length)], slot: false,
    rows: S.drills.map(x=>[String(x.n), x.title, x.cat, "st_d" + x.n])
  }, "s1_3");
  S.drills.forEach(x=>put("st_d" + x.n, {
    title: x.title, pills: ["Старт", x.cat, x.level], doc: x.doc
  }, "st_d0"));

  put("tn_d0", {
    title: "Повороты — упражнения",
    lede: "Упражнения на отработку поворотов: вращение, ориентировка в воде, поворот под нагрузкой. Разбор каждого поворота — в разделе «Обучение с нуля».",
    pills: [nDrills(V.drills.length)], slot: false,
    rows: V.drills.map(x=>[String(x.n), x.title, x.cat, "tnd_" + x.n])
  }, "s1_3");
  V.drills.forEach(x=>put("tnd_" + x.n, {
    title: x.title, pills: ["Повороты", x.cat, x.level], doc: x.doc
  }, "tn_d0"));
})();

/* Раздел «Суша для пловца» из susha.js.
   Файл писал не я, поэтому собираю бережно: беру только те поля,
   которые в данных реально есть, и ничего не додумываю. */
(function(){
  // Каждая вкладка собирается независимо: нет файла с данными —
  // остаётся заглушка, но остальные вкладки от этого не страдают.
  const put = (id, screen, parent)=>{ T[id] = screen; if(parent) PARENT[id] = parent; };
  const D = [];
  const p  = (d,t)=>{ if(t) d.push(["p", t]); };
  const ul = (d,a)=>{ if(a && a.length) d.push(["ul", a]); };
  const kv = (d,label,t)=>{ if(t) d.push(["kv", [label, t]]); };
  const warn = (d,t)=>{ if(t) d.push(["warn", t]); };
  const tip  = (d,t)=>{ if(t) d.push(["tip", t]); };
  const h2 = (d,t)=>{ if(t) d.push(["h2", t]); };
  const h3 = (d,t)=>{ if(t) d.push(["h3", t]); };

  // Карточка упражнения из каталога: код, название и всё, что к нему приложено
  const exBlocks = (d, x)=>{
    d.push(["h4", (x.code ? x.code + ". " : (x.n ? x.n + ". " : "")) + x.name]);
    kv(d, "Как выполнять", x.how);
    kv(d, "Что даёт в воде", x.benefit || x.why);
    kv(d, "Дозировка", x.dose);
    kv(d, "Легче", x.easier);
    kv(d, "Сложнее", x.harder);
    kv(d, "На что смотреть", x.watch);
  };

  // Каталог: зоны с упражнениями на одной странице
  const catalogue = (id, src, parent, lede)=>{
    const d = [];
    p(d, src.intro);
    (src.zones||[]).forEach(z=>{ h3(d, z.title); (z.items||[]).forEach(x=>exBlocks(d, x)); });
    tip(d, src.watch);
    warn(d, src.safety);
    const n = (src.zones||[]).reduce((s,z)=>s+(z.items||[]).length,0);
    put(id, { title: src.title, lede, pills: [nDrills(n)], doc: d }, parent);
    return n;
  };

  /* ---- 3.1 Разминка перед водой ---- */
  if(typeof SUSHA_WARMUP !== "undefined"){
    const W = SUSHA_WARMUP, d = [];
    p(d, W.intro);
    ul(d, W.equip);
    (W.parts||[]).forEach(part=>{
      h3(d, part.title);
      p(d, part.note);
      (part.items||[]).forEach(x=>{
        d.push(["h4", x.n + ". " + x.name]);
        kv(d, "Как выполнять", x.how);
        kv(d, "Зачем", x.why);
        kv(d, "На что смотреть", x.watch);
      });
    });
    tip(d, W.total);
    warn(d, W.safety);
    const n = (W.parts||[]).reduce((s,x)=>s+(x.items||[]).length,0);
    put("d1", { title: W.title, lede: W.subtitle, pills: [nDrills(n)], doc: d }, "s3");
  }

  /* ---- 3.2 Гребковые тренировки на резине ----
     Три вкладки по стилям. Внутри каждой — вся тренировка целиком:
     разминка, крепление, жёсткость, фазы гребка, рабочая серия,
     заминка и чек-лист. Человек выбирает стиль один раз и дальше
     просто листает сверху вниз, ничего не собирая по вкладкам. */
  if(typeof SUSHA_BAND !== "undefined"){
    const B = SUSHA_BAND;
    // Ровно три вкладки и в этом порядке. В данных есть ещё спина,
    // но на резине её не отрабатывают — в раздел она не идёт.
    const ORDER = ["crawl", "breast", "breaststroke", "fly", "dolphin", "butterfly"];
    const SN = { crawl:"Кроль", breast:"Брасс", breaststroke:"Брасс", fly:"Дельфин", dolphin:"Дельфин", butterfly:"Дельфин" };

    // общий кусок: заголовок раздела и его содержимое
    const chunk = (d, o)=>{
      if(!o) return;
      h2(d, o.title);
      p(d, o.how || o.rule || o.intro);
      ul(d, o.points || o.items);
      tip(d, o.watch);
    };
    const external = (d, o)=>{
      if(typeof o === "undefined" || !o) return;
      h2(d, o.title);
      (o.doc||[]).forEach(b=>d.push(b));
    };

    const keys = Object.keys(B.strokes||{})
      .filter(k=>ORDER.indexOf(k) >= 0)
      .sort((a,b)=>ORDER.indexOf(a) - ORDER.indexOf(b));

    const rows = keys.map(k=>{
      const S = B.strokes[k], name = S.name || SN[k] || k, d = [];

      external(d, typeof REZINA_WARMUP !== "undefined" ? REZINA_WARMUP : null);
      chunk(d, B.setup);
      chunk(d, B.fit);

      h2(d, "Фазы гребка");
      p(d, S.note);
      (S.phases||[]).forEach(f=>{
        d.push(["h4", f.n + ". " + f.name]);
        kv(d, "Дозировка", f.dose);
        kv(d, "Как выполнять", f.how);
        kv(d, "На что смотреть", f.watch);
        kv(d, "Частая ошибка", f.mistake);
      });

      external(d, typeof REZINA_SERIES !== "undefined" ? REZINA_SERIES : null);
      chunk(d, B.cooldown);

      if(B.checklist){ h2(d, "Короткий чек-лист"); ul(d, B.checklist); }
      warn(d, B.safety);

      const id = "d2_" + k;
      put(id, {
        title: name + " на резине",
        lede: S.note || "Разбираем гребок по фазам, потом собираем в рабочую серию.",
        pills: [plural((S.phases||[]).length,["фаза гребка","фазы гребка","фаз гребка"])],
        doc: d
      }, "d2");
      return ["", name, plural((S.phases||[]).length,["фаза гребка","фазы гребка","фаз гребка"]), id];
    });

    const d = [];
    p(d, B.intro);
    ul(d, B.equip);
    put("d2", {
      title: B.title,
      lede: "Выберите стиль — внутри вся тренировка целиком, от разминки до заминки.",
      slot: false, rows, doc: d
    }, "s3");
  }

  /* ---- 3.3 Кор и стабилизация ----
     Две вкладки: справочник упражнений и готовые комплексы.
     «Как выполнять» с таймером не лежит отдельной страницей, а повторяется
     в каждом комплексе — человек не должен уходить за правилами в другое
     место, когда уже стоит на коврике. */
  if(typeof SUSHA_STATICS !== "undefined"){

    // как выполнять: один и тот же блок, вклеивается в каждый комплекс
    const howto = d=>{
      if(typeof SUSHA_CORE_HOWTO === "undefined") return;
      const H = SUSHA_CORE_HOWTO;
      h2(d, H.title || "Как выполнять");
      p(d, H.intro);
      ul(d, H.points);
      p(d, H.scale);
      tip(d, H.watch);
      warn(d, H.safety);
    };

    // 3.3.1 Упражнения → статика и динамика
    const nSt = catalogue("d3_st", SUSHA_STATICS, "d3_ex", "Удержания: справочник с техникой и дозировкой.");
    const nDy = catalogue("d3_dy", SUSHA_DYNAMICS, "d3_ex", "Движения: справочник с техникой и дозировкой.");
    put("d3_ex", {
      title: "Упражнения",
      lede: "Справочник: техника, дозировка и варианты полегче и посложнее у каждого упражнения.",
      pills: [nDrills(nSt + nDy)],
      slot: false,
      rows: [
        ["", "Статика", nDrills(nSt), "d3_st"],
        ["", "Динамика", nDrills(nDy), "d3_dy"]
      ]
    }, "d3");

    // 3.3.2 Комплексы → каждый своей страницей
    const cx = [];

    (typeof SUSHA_CORE_COMPLEXES !== "undefined" ? SUSHA_CORE_COMPLEXES : []).forEach(c=>{
      const d = [];
      p(d, c.desc);
      howto(d);
      h2(d, "Что делаем");
      (c.items||[]).forEach(x=>d.push(["kv", [x.code + ". " + x.name,
        (x.intervals ? plural(x.intervals,["интервал","интервала","интервалов"]) : "") + (x.note ? " — " + x.note : "")]]));
      tip(d, c.watch);
      const id = "d3_c" + c.n;
      put(id, { title: c.title, lede: c.tag, doc: d }, "d3_cx");
      cx.push([String(c.n), c.title, c.tag, id]);
    });

    if(typeof SUSHA_DRESSEL !== "undefined"){
      const R = SUSHA_DRESSEL, d = [];
      p(d, R.about);
      ul(d, R.rules);
      h2(d, "Упражнения");
      (R.items||[]).forEach(x=>exBlocks(d, x));
      if(R.table){
        h2(d, "Схема раундов");
        d.push(["tbl", [R.table.head].concat(R.table.rows||[])]);
      }
      kv(d, "Коротко", R.short);
      kv(d, "Как часто", R.frequency);
      tip(d, R.watch);
      warn(d, R.safety);
      put("d3_dr", { title: R.title, lede: R.tag, doc: d }, "d3_cx");
      cx.push(["", R.title, R.short || R.tag, "d3_dr"]);
    }

    put("d3_cx", {
      title: "Комплексы упражнений",
      lede: "Готовые связки по таймеру. В каждом комплексе есть и список упражнений, и правила выполнения.",
      pills: [plural(cx.length,["комплекс","комплекса","комплексов"])],
      slot: false, rows: cx
    }, "d3");

    put("d3", { title: "Кор и стабилизация",
      lede: "Справочник удержаний и движений плюс готовые комплексы по таймеру.",
      slot: false,
      rows: [
        ["", "Упражнения", nDrills(nSt + nDy) + " · статика и динамика", "d3_ex"],
        ["", "Комплексы упражнений", plural(cx.length,["комплекс","комплекса","комплексов"]) + " · таймер 45/15", "d3_cx"]
      ]
    }, "s3");
  }

  /* ---- 3.4 Круговые тренировки ----
     Две вкладки: станции и сами тренировки. Правила с таймером стоят
     в начале каждой тренировки — их читают до того, как встают на коврик,
     а не после списка станций. */
  if(typeof SUSHA_CIRCUIT_EX !== "undefined"){

    const howto = d=>{
      if(typeof SUSHA_CIRCUIT_HOWTO === "undefined") return;
      const H = SUSHA_CIRCUIT_HOWTO;
      h2(d, H.title || "Как выполнять");
      p(d, H.intro);
      ul(d, H.points);
      kv(d, "Разминка", H.warmup);
      kv(d, "Заминка", H.cooldown);
      p(d, H.scale);
      warn(d, H.safety);
    };

    const nEx = catalogue("d4_ex", SUSHA_CIRCUIT_EX, "d4", "Станции: техника, дозировка и варианты полегче.");

    const w = [];
    (typeof SUSHA_CIRCUIT_WORKOUTS !== "undefined" ? SUSHA_CIRCUIT_WORKOUTS : []).forEach(c=>{
      const d = [];
      p(d, c.desc);
      howto(d);
      h2(d, "Станции");
      (c.stations||[]).forEach(x=>d.push(["kv", [x.code + ". " + x.name, x.amount || ""]]));
      tip(d, c.watch);
      const id = "d4_w" + c.n;
      put(id, { title: c.title, lede: c.tag, doc: d }, "d4_cx");
      w.push([String(c.n), c.title, c.tag, id]);
    });

    put("d4_cx", {
      title: "Круговые тренировки",
      lede: "Готовые круги по станциям. В каждой тренировке сразу написано, как её выполнять.",
      pills: [plural(w.length,["тренировка","тренировки","тренировок"])],
      slot: false, rows: w
    }, "d4");

    put("d4", { title: "Круговые тренировки",
      lede: "Общая физподготовка: всё тело, высокий пульс, около тридцати минут.",
      slot: false,
      rows: [
        ["", "Упражнения", nDrills(nEx) + " · техника и дозировка", "d4_ex"],
        ["", "Круговые тренировки", plural(w.length,["тренировка","тренировки","тренировок"]) + " · таймер 45/15", "d4_cx"]
      ]
    }, "s3");
  }

  /* ---- 3.5 Гибкость ----
     Одна сплошная страница, как разминка перед водой: правила сверху,
     дальше упражнения подряд. Зоны идут в том порядке, в котором их
     разумно выполнять — сверху вниз по телу. */
  if(typeof SUSHA_FLEX_EX !== "undefined"){
    const E = SUSHA_FLEX_EX, d = [];

    p(d, E.intro);
    ul(d, E.equip);

    if(typeof SUSHA_FLEX_HOWTO !== "undefined"){
      const H = SUSHA_FLEX_HOWTO;
      h2(d, H.title || "Как выполнять");
      p(d, H.intro); ul(d, H.points); p(d, H.timer);
      h3(d, H.whenTitle); ul(d, H.when);
      h3(d, H.scaleTitle); ul(d, H.scale);
      tip(d, H.watch);
      warn(d, H.safety);
    }

    (E.pre||[]).forEach(z=>{ h3(d, z.title); p(d, z.note); tip(d, z.tip); warn(d, z.safety); });

    // Сверху вниз: сначала спина и шея, потом плечо, таз, задняя
    // поверхность и стопа. Парные упражнения последними — партнёр есть
    // не всегда, и без них последовательность остаётся целой.
    const ORDER = ["Шея и спина", "Плечо и грудной отдел", "Таз",
                   "Задняя поверхность", "Голеностоп и стопа", "В паре"];
    const zones = (E.zones||[]).slice().sort((a,b)=>{
      const i = ORDER.indexOf(a.title), j = ORDER.indexOf(b.title);
      return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
    });

    // Нумерация сквозная и по порядку выполнения: первое упражнение — № 1.
    // Исходные коды Г-N шли по зонам справочника и после пересортировки
    // выглядели бы вразнобой.
    let num = 0;
    zones.forEach(z=>{
      h2(d, z.title);
      p(d, z.note);
      (z.items||[]).forEach(x=>{
        d.push(["h4", (++num) + ". " + x.name]);
        kv(d, "Как выполнять", x.how);
        kv(d, "Зачем это пловцу", x.benefit);
        kv(d, "На что смотреть", x.watch);
        if(x.safety) d.push(["warn", x.safety]);
      });
    });

    const n = zones.reduce((s,z)=>s+(z.items||[]).length,0);
    put("d5", {
      title: "Гибкость",
      lede: "Упражнения идут подряд и в том порядке, в котором их выполняют — сверху вниз по телу.",
      pills: [nDrills(n)],
      doc: d
    }, "s3");
  }
})();

/* Числа в описании на главной подставляем из самих данных: сколько
   в файлах реально лежит, столько и обещаем. Разойтись не может.
   Те же числа показывает лента «Сегодня», поэтому складываем их
   в COUNTS, а не пересчитываем во второй раз. */
let COUNTS = {};
(function(){
  const A = T.home.about;
  if(!A) return;
  const zc = o => (typeof o !== "undefined" && o && o.zones) ? o.zones.reduce((s,z)=>s+(z.items||[]).length,0) : 0;
  const N = {};

  if(typeof AERO !== "undefined" && typeof BLOCKS !== "undefined"){
    let n = 0;
    Object.values(AERO).forEach(L=>L.blocks.forEach(b=>n += b.w.length));
    Object.values(BLOCKS).forEach(D=>Object.values(D.levels).forEach(L=>n += L.w.length));
    N.trainings = n;
  }
  if(typeof UCH !== "undefined"){
    N.drills = UCH.drills.reduce((s,g)=>s+g.items.length,0);
    N.errors = UCH.errors.reduce((s,g)=>s+g.items.length,0);
    N.turns  = UCH.turns.list.length;
  }
  N.dry = zc(typeof SUSHA_STATICS !== "undefined" ? SUSHA_STATICS : null)
        + zc(typeof SUSHA_DYNAMICS !== "undefined" ? SUSHA_DYNAMICS : null)
        + zc(typeof SUSHA_CIRCUIT_EX !== "undefined" ? SUSHA_CIRCUIT_EX : null)
        + zc(typeof SUSHA_FLEX_EX !== "undefined" ? SUSHA_FLEX_EX : null)
        + (typeof SUSHA_WARMUP !== "undefined" ? (SUSHA_WARMUP.parts||[]).reduce((s,p)=>s+(p.items||[]).length,0) : 0);

  // «{dry}+» — округляем вниз до десятков и оставляем плюс: обещаем меньше,
  // чем есть. Строку с неизвестным числом убираем, а не показываем «{drills}».
  A.points = A.points
    .map(([num, text])=>{
      const plus = String(num).endsWith("+");
      const m = String(num).match(/^\{([a-z]+)(?:\|(\d+))?\}/);
      if(!m || !N[m[1]]) return null;
      // шаг округления задан в самой строке: 210 при шаге 100 даёт «200+»
      const step = m[2] ? +m[2] : 1;
      const v = Math.floor(N[m[1]] / step) * step;
      return [v + (plus ? "+" : ""), text];
    })
    .filter(Boolean);

  COUNTS = N;
})();

/* Спортивная литература: раздел → подраздел → (иногда ещё вкладка) → книга.
   Счётчики на карточках считаются по данным, поэтому разойтись не могут. */
if(typeof LIT !== "undefined"){

  const ЕДИН = ["книга","книги","книг"];
  const ПУСТО = "Книги этого раздела ещё готовятся. Мы выкладываем их по одной: " +
    "каждую сначала читаем сами и пишем, что из неё брать, а что можно пролистать.";

  // Экран со списком книг. Пустой — с честной заглушкой вместо голой страницы.
  function listScreen(node){
    return node.books.length ? {
      title: node.t, lede: node.s + ".", slot: false,
      // Года может не быть у самиздата — тогда точка не должна висеть в воздухе.
      rows: node.books.map((b,i)=>[String(i+1), b.t,
        [b.a, b.year].filter(Boolean).join(" · "), b.id])
    } : { title: node.t, lede: node.s + ".", doc: [["p", ПУСТО]] };
  }

  function bookScreen(b){
    return {
      title: b.t,
      book: b,
      doc: [["h2","О чём книга"]]
        .concat(b.about.map(p=>["p",p]))
        .concat([["h2","Что брать"]])
        .concat(b.take.map(p=>["p",p]))
        // Книги, переведённые машиной, путаются в терминах. Словарик
        // ставим до «кому подойдёт», чтобы человек прочёл его до скачивания.
        .concat(b.glossary ? [["h2","Как читать перевод"],
          ["p","Книга переведена автоматически, и в терминах перевод местами врёт. Вот что имеется в виду там, где написано странно."],
          ["tbl", [["В книге","На самом деле"]].concat(b.glossary)]] : [])
        .concat([["h2","Кому подойдёт"],["p", b.who]])
        // Оглавление: главы нумеруем сами, подпункты (третье поле = 2)
        // идут без номера и с отбивкой, иначе счёт съезжает.
        // У электронных изданий страниц нет — тогда это просто список.
        .concat([["h2","Оглавление"], b.toc.some(r=>r[1])
          ? ["tbl", [["Глава","Стр."]].concat((()=>{ let n = 0; return b.toc.map(r=>
              r[2] === 2 ? ["— " + r[0], r[1]] : [(++n) + ". " + r[0], r[1]]); })())]
          : ["num", b.toc.map(r=>r[0])]])
        .concat([["h2","Об авторе"],["p", b.author]])
    };
  }

  function attachBooks(node){
    (node.books||[]).forEach(b=>{ PARENT[b.id] = node.id; T[b.id] = bookScreen(b); });
  }

  T.s6.kids = LIT.map(sec=>({
    id: sec.id, n: sec.n, t: sec.t, s: sec.s,
    m: sec.subs
      ? plural(sec.subs.reduce((s,x)=>s+x.books.length,0), ЕДИН)
      : (sec.books.length ? plural(sec.books.length, ЕДИН) : "готовится")
  }));

  LIT.forEach(sec=>{
    PARENT[sec.id] = "s6";

    if(sec.subs){
      // Раздел с вложенными вкладками: сам показывает карточки вкладок.
      T[sec.id] = {
        title: sec.t, lede: sec.s + ".",
        kids: sec.subs.map(sub=>({
          id: sub.id, n: sub.n, t: sub.t, s: sub.s,
          m: sub.books.length ? plural(sub.books.length, ЕДИН) : "готовится"
        }))
      };
      sec.subs.forEach(sub=>{
        PARENT[sub.id] = sec.id;
        T[sub.id] = listScreen(sub);
        attachBooks(sub);
      });
    } else {
      T[sec.id] = listScreen(sec);
      attachBooks(sec);
    }
  });
}

   адрес телеграму, если он рядом, и только иначе открываем вкладкой. */
function openExt(url){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg && /^https?:\/\/t\.me\//.test(url) && tg.openTelegramLink) return tg.openTelegramLink(url);
  if(tg && tg.openLink) return tg.openLink(url);
  window.open(url, "_blank", "noopener");
}

/* Класс по длине надписи. Кегль заголовка нельзя задать раз и навсегда:
   в приложении соседствуют «Кроль» и «1500 упражнений для моделирования
   круговой тренировки». Считаем знаки и отдаём вёрстке подсказку. */
const lenCls = (t, mid, big) => {
  const n = String(t || "").length;
  return n > big ? " xlong" : n > mid ? " long" : "";
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============================================================
   ЛЕНТА «СЕГОДНЯ»
   ------------------------------------------------------------
   Главная больше не оглавление, а подборка на день. Подборка не
   случайная и не придуманная руками: она считается от даты. Один
   и тот же день даёт одну и ту же тренировку у всех, завтра она
   сменится сама. Сервер для этого не нужен — и это важно, потому
   что сервера у приложения нет.
   ============================================================ */
T.home.feed = true;

const МЕСЯЦЫ = ["января","февраля","марта","апреля","мая","июня",
                "июля","августа","сентября","октября","ноября","декабря"];

// Номер дня от начала эпохи. Считаем по местной дате, а не по UTC:
// иначе подборка сменится в неурочный час.
function dayNo(){
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
// Берём элемент по номеру периода. Разные разделы сдвигаем солью,
// иначе тренировка и упражнение всегда выпадали бы «парой».
const byDay = (arr, period, salt) =>
  arr.length ? arr[Math.abs(Math.floor(dayNo() / period) + salt) % arr.length] : null;

/* Выбор уровня. Показывается на главной, пока уровень неизвестен, и
   всегда — на своём экране в «Ещё». Одна и та же разметка, чтобы
   выбор выглядел одинаково и в первый раз, и при смене. */
function levelPickHTML(head){
  let h = "";
  if(head){

    h += `<p class="lede">Нужен ровно для одного: чтобы главный экран предлагал тренировку по силам. Весь каталог открыт целиком в любом случае, и уровень можно поменять в «Ещё» в любой момент.</p>`;
  }
  h += `<div class="lvls">`;
  LEVELS.forEach(l=>{
    h += `<button class="lvl${LEVEL === l.id ? " on" : ""}" onclick="pickLevel('${l.id}')">
      <span class="lvl-h"><b>${esc(l.n)}</b><i>${esc(l.vol)}</i></span>
      <span class="lvl-s">${esc(l.s)}</span>
      ${LEVEL === l.id ? `<span class="lvl-now">Ваш уровень</span>` : ""}
    </button>`;
  });
  h += `</div>`;
  return h;
}

function feedPools(){
  /* Тренировки: берём экраны, где лежит одно занятие целиком, и
     оставляем только свой уровень. Буква уровня — у родителя:
     sk_n_11 лежит в sk_n. Если уровень ещё не выбран, берём все —
     лента не должна пустеть из-за ненастроенного приложения. */
  const work = Object.keys(T)
    .filter(k => T[k] && T[k].one)
    .filter(k => !LEVEL || String(PARENT[k] || "").endsWith("_" + LEVEL))
    .sort();

  // Технические упражнения
  const drills = [];
  if(typeof UCH !== "undefined" && UCH.drills)
    UCH.drills.forEach(g => g.items.forEach(x =>
      drills.push({id:g.key + "_" + x.n, t:x.title, s:g.name + " · " + x.cat})));

  // Типичные ошибки
  const errs = [];
  if(typeof UCH !== "undefined" && UCH.errors)
    UCH.errors.forEach(g => g.items.forEach(x =>
      errs.push({id:g.key + "_" + x.n, t:x.title, s:g.name})));

  // Книги: и те, что лежат прямо в разделе, и те, что во вкладках
  const books = [];
  if(typeof LIT !== "undefined")
    LIT.forEach(sec => {
      const put = node => (node.books || []).forEach(b =>
        books.push({id:b.id, t:b.t, a:b.a, about:(b.about || [])[0] || ""}));
      put(sec);
      (sec.subs || []).forEach(put);
    });

  return {work, drills, errs, books};
}

/* Дата новости. Показываем сразу два: «как давно» и «когда именно».
   Одного «сегодня» мало — через месяц человек не поймёт, свежая это
   запись или лежит с весны. Одной даты тоже мало: «2 сентября» само
   по себе не говорит, вчера это было или полгода назад.

   Пока записи меньше недели, ведущим ставим срок, а точную дату
   даём следом. Дальше срок в днях уже ничего не проясняет — остаётся
   дата. Год дописываем только для прошлых лет: в своём году он
   выглядит как канцелярия. */
function nWhen(d){
  const s = String(d || "");
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return s;
  const then = new Date(+m[1], +m[2] - 1, +m[3]);
  const now = new Date();
  const days = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) -
                           Date.UTC(then.getFullYear(), then.getMonth(), then.getDate())) / 86400000);

  let full = then.getDate() + " " + МЕСЯЦЫ[then.getMonth()];
  if(then.getFullYear() !== now.getFullYear()) full += " " + then.getFullYear();

  // Дата из будущего — это опечатка в news.js, а не новость. Молча
  // показывать «-3 дня назад» нельзя, поэтому оставляем одну дату.
  if(days < 0) return full;

  let rel = "";
  if(days === 0) rel = "сегодня";
  else if(days === 1) rel = "вчера";
  else if(days < 7) rel = days + " " + plural(days, ["день","дня","дней"]).split(" ")[1] + " назад";

  return rel ? rel + " · " + full : full;
}

// Старое имя оставлено: на него ссылаются проверки и карточки.
function nDate(d){ return nWhen(d) }

/* Виджеты постов. Телеграм отдаёт их скриптом, который заменяет сам себя
   на рамку с постом. Скрипт нужно создать через createElement — вставленный

        <span class="d">${esc([d.title, p[2]].filter(Boolean).join(" · "))}</span>

/* Какой вкладке принадлежит экран. Идём вверх по родителям, пока не
   упрёмся в экран, который открывает какая-нибудь вкладка. Цепочка
   всегда кончается на «home», а его открывает «Сегодня», — значит,
   безответных экранов быть не может. */
function tabOf(id){
  let cur = id;
  for(let i = 0; cur && i < 40; i++){
    const t = TABS.find(x => x.to === cur);
    if(t) return t;
    cur = PARENT[cur];
  }
  return TABS[0];
}

/* Красим страницу в цвет вкладки. Вместе с фоном перекрашиваем полосу
   телеграма и строку состояния браузера: если этого не сделать, сверху
   остаётся ступенька чужого цвета — она заметнее самого фона. */
function paintTab(t){
  const R = document.documentElement;
  if(!R || !R.style) return;
  R.style.setProperty("--ac", t.ac);
  R.style.setProperty("--ac-rgb", t.acr);

  /* Подменяем весь набор акцента целиком. Всё, что в файле набрано
     «золотом», ссылается на эти шесть переменных, поэтому одной сменой
     перекрашиваются заголовки, номера, кромки карточек, крошки и
     подписи — а не только значок вкладки. Знак и название в шапке
     держатся за --brand и остаются золотыми на всех вкладках: это
     единственное, что должно быть одинаковым везде. */
  R.style.setProperty("--gold", t.base);
  R.style.setProperty("--gold-lt", t.lt);
  R.style.setProperty("--gold-dk", t.dk);
  R.style.setProperty("--gold-rgb", t.rgb);
  R.style.setProperty("--hi-rgb", t.hi);
  R.style.setProperty("--txt-sub", t.sub);
  R.style.setProperty("--gold-metal",
    `linear-gradient(180deg, rgb(${t.hi}) 0%, ${t.base} 55%, ${t.dk} 100%)`);
  R.style.setProperty("--gold-metal-dim",
    `linear-gradient(180deg, ${t.lt} 0%, ${t.dk} 100%)`);
  /* Фон «Глубина»: три слоя.
     1) оттенок вкладки сверху — по нему узнаётся, где ты;
     2) еле заметная косая штриховка — она даёт фактуру, из-за которой
        экран выглядит плотнее, чем один ровный градиент;
     3) затемнение к низу — страница «сидит» в тени, а не обрывается.
     Штриховку держим на 2,2%: выше она начинает муарить на дешёвых
     экранах, ниже — просто не видна. */
  /* Снимок вкладки, если он есть, ложится между штриховкой и цветом.
     Затемнение и растворение книзу уже впечатаны в сам файл — там их
     можно было измерить по пикселям, а в градиенте нельзя. */
  const photo = t.ph ? `url('${t.ph}') top center / 100% auto no-repeat,` : "";
  R.style.setProperty("--glow",
    `repeating-linear-gradient(115deg, rgba(255,255,255,.022) 0 2px, rgba(255,255,255,0) 2px 9px),` +
    photo +
    `radial-gradient(120% 58% at 50% -8%, rgba(${t.g},.85) 0%, rgba(${t.g},.30) 44%, rgba(${t.g},0) 78%),` +
    `radial-gradient(105% 48% at 50% 106%, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%),` +
    `linear-gradient(var(--bg), var(--bg))`);

  const meta = document.querySelector && document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t.hdr);

  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg && tg.setHeaderColor && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")){
    try{ tg.setHeaderColor(t.hdr); }catch(e){}
  }
}

    }

    if(d.posters){

      h += `<div style="margin-top:22px" class="slot"><b>Обложки подгружаются автоматически</b>Фильмы через TMDB, книги через Open Library — по названию и году</div>`;

        h += `<button class="row">

  stopGame();                    // уходим с экрана — гасим цикл игры
  stopBreath();                  // и цикл дыхания: они живут независимо
  // На заплыве палец управляет пловцом, а не страницей.
  if(document.body) document.body.classList.toggle("noscroll", !!d.game);
