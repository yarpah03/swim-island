/* Персональная ссылка приглашения. Идентификатор берём у телеграма:
   он у каждого свой и не меняется. Считать переходы будет бот — сайт
   статический и ничего запоминать не умеет, он только собирает адрес. */
function setupRef(){
  const box = document.getElementById("refbox");
  if(!box) return;
  const val = document.getElementById("refv");
  const tg  = window.Telegram && window.Telegram.WebApp;
  const id  = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;

  if(!SERVICE.bot){
    box.classList.add("off");
    val.textContent = "Приглашения скоро заработают — мы заканчиваем настройку бота.";
    return;
  }
  if(!id){
    box.classList.add("off");
    val.textContent = "Ссылку видно, когда приложение открыто внутри телеграма. Зайдите через бота — она появится здесь.";
    return;
  }

  const link = "https://t.me/" + SERVICE.bot + "?start=ref" + id;
  val.textContent = link;

  document.getElementById("refcopy").onclick = function(){
    const done = () => { this.textContent = "Скопировано"; setTimeout(()=>{ this.textContent = "Скопировать"; }, 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(done).catch(()=>{});
    } else {
      // старые вебвью не умеют clipboard — выделяем текст, копирует человек
      const r = document.createRange(); r.selectNodeContents(val);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      this.textContent = "Выделено — скопируйте";
    }
  };

  document.getElementById("refshare").onclick = function(){
    const text = "Плавательный остров VIP — обучение всем стилям, готовые тренировки и разборы техники. Заходи по моей ссылке:";
    openExt("https://t.me/share/url?url=" + encodeURIComponent(link) + "&text=" + encodeURIComponent(text));
  };
}

/* ============================================================
   ЗАПЛЫВ — игра на одно касание
   ------------------------------------------------------------
   Пловец опускается, гребок подбрасывает вверх, навстречу идут
   разделительные дорожки с просветом. Задел трос — конец заплыва.
   Всё считается в долях от размера холста, поэтому на любом экране
   игра одинаковой сложности: на планшете не легче, чем на телефоне.
   ============================================================ */
let gameRAF = null, gameOff = null, gameResize = null;
const BEST_KEY = "swim_island_best";

/* Снимок бассейна для фона игры. Грузим один раз на всё приложение и
   только когда игру открыли: тем, кто в неё не заходит, он не нужен.
   Если файла нет или сеть подвела — игра просто рисует градиент. */
let bgImg = null, bgAsked = false;
function loadGameBg(){
  if(bgAsked || typeof Image !== "function") return;
  bgAsked = true;
  const im = new Image();
  im.onload = () => { if(im.width && im.height) bgImg = im; };
  im.onerror = () => { bgImg = null; };
  im.src = "hero-mobile.jpg";
}

// Хранилище браузера бывает запрещено настройками или режимом инкогнито.
// Тогда просто живём без рекорда, а не роняем экран.
function readBest(){
  try{ return parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; }catch(e){ return 0; }
}
function writeBest(v){ try{ localStorage.setItem(BEST_KEY, String(v)); }catch(e){} }

/* Рекорд текущего месяца — отдельно от рекорда за всё время.
   Призы разыгрываются каждый месяц, а рекорд за всё время к первому
   числу не обнуляется: человек, поставивший 900 метров в июне, иначе
   выглядел бы лидером и в сентябре, ничего в сентябре не проплыв.
   Храним месяц вместе со значением — по нему и понимаем, что пора
   начинать заново. Никуда не отправляем: это по-прежнему только
   ваш телефон. */
const MONTH_KEY = "swim_island_best_month";
const nowMonth = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
};
function readMonthBest(){
  try{
    const r = JSON.parse(localStorage.getItem(MONTH_KEY) || "null");
    return (r && r.m === nowMonth()) ? (parseInt(r.v, 10) || 0) : 0;
  }catch(e){ return 0; }
}
function writeMonthBest(v){
  try{ localStorage.setItem(MONTH_KEY, JSON.stringify({m: nowMonth(), v: v})); }catch(e){}
}

// Личный рекорд на вкладке «Рейтинг»
function setupBest(){
  const put = (id, v, empty) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.textContent = v ? v + " м" : empty;
    el.classList.toggle("empty", !v);
  };
  put("bestm", readMonthBest(), "В этом месяце ещё не плавали");
  put("bestv", readBest(), "Ещё не плавали — самое время начать");
}

function stopGame(){
  if(gameRAF){ cancelAnimationFrame(gameRAF); gameRAF = null; }
  if(gameOff){ gameOff(); gameOff = null; }   // снимаем обработчики
}

/* ============================================================
   КВАДРАТНОЕ ДЫХАНИЕ
   ------------------------------------------------------------
   Четыре равных отрезка — вдох, задержка, выдох, задержка. Шарик
   проходит по одной стороне квадрата за отрезок, в середине —
   название фазы и обратный отсчёт.

   Почему не просто цифры: вслух считать неудобно, а по секундомеру
   человек сбивается. Глазу нужна точка, за которой он следит, — и
   тогда счёт перестаёт требовать усилия.

   Живёт отдельно от заплыва: у них свои циклы и свои обработчики,
   и один не должен гасить другой.
   ============================================================ */
let breathRAF = null, breathOff = null, breathResize = null;
const BSEC_KEY = "swim_breath_sec";

// Обход по часовой стрелке от нижнего левого угла: вверх — вдох,
// вправо — задержка, вниз — выдох, влево — снова задержка. Подъём
// шарика совпадает с наполнением лёгких, и объяснять это не нужно.
const BPHASES = [
  {n:"Вдох",     hint:"через нос, живот вперёд"},
  {n:"Задержка", hint:"не напрягайтесь"},
  {n:"Выдох",    hint:"ртом, мягко"},
  {n:"Задержка", hint:"спокойно, пусто"}
];

function readBSec(){
  try{ const v = parseInt(localStorage.getItem(BSEC_KEY), 10);
       return (v >= 3 && v <= 6) ? v : 4; }catch(e){ return 4; }
}
function writeBSec(v){ try{ localStorage.setItem(BSEC_KEY, String(v)); }catch(e){} }

// Выбор длины отрезка — из разметки, поэтому функция глобальная
function setBreathSec(v){
  writeBSec(v);
  render(location.hash.slice(1) || "home");
}

function stopBreath(){
  if(breathRAF){ cancelAnimationFrame(breathRAF); breathRAF = null; }
  if(breathOff){ breathOff(); breathOff = null; }
  breathResize = null;
}

function setupBreath(){
  const cv = document.getElementById("bcv");
  if(!cv) return;
  const ctx = cv.getContext("2d");
  const btn = document.getElementById("bplay");
  const cyc = document.getElementById("bcycles");

  const SEC = readBSec();
  let W = 0, H = 0;
  let running = false, phase = 0, t = 0, cycles = 0, last = 0;

  function fit(){
    const r = cv.getBoundingClientRect();
    if(!r.width) return false;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }

  const css = n => {
    try{ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
    catch(e){ return ""; }
  };
  const BALL = css("--lane-3") || "#CE4038";
  const LINE = css("--gold-line") || "rgba(185,138,46,.30)";
  const ACC  = css("--gold-lt")   || "#D0A445";
  const TXT  = css("--txt")       || "#EDF1F6";
  const TX2  = css("--txt-2")     || "#9BA7B8";
  const TX3  = css("--txt-3")     || "#6A778A";

  /* Углы квадрата по порядку обхода. Начинаем снизу слева: вдох ведёт
     шарик вверх, и это читается без подписи. */
  function corners(){
    const pad = Math.max(26, Math.min(W, H) * 0.13);
    const s = Math.min(W, H) - pad * 2;
    const x = (W - s) / 2, y = (H - s) / 2;
    return [[x, y + s], [x, y], [x + s, y], [x + s, y + s]];
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    const c = corners();
    const r = Math.max(7, Math.min(W, H) * 0.028);

    // дорожка квадрата
    ctx.beginPath();
    ctx.moveTo(c[0][0], c[0][1]);
    for(let i = 1; i < 4; i++) ctx.lineTo(c[i][0], c[i][1]);
    ctx.closePath();
    ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();

    // пройденная часть текущей стороны — светлее
    const a = c[phase], b = c[(phase + 1) % 4];
    const k = running ? t / SEC : 0;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k);
    ctx.strokeStyle = ACC; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke();

    // шарик
    const bx = a[0] + (b[0] - a[0]) * k, by = a[1] + (b[1] - a[1]) * k;
    ctx.beginPath(); ctx.arc(bx, by, r * 2.1, 0, 6.284);
    ctx.fillStyle = "rgba(206,64,56,.16)"; ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, r, 0, 6.284);
    ctx.fillStyle = BALL; ctx.fill();

    // середина: фаза, обратный отсчёт, подсказка
    const cx = W / 2, cy = H / 2;
    const P = BPHASES[phase];
    ctx.textAlign = "center";

    if(running){
      ctx.fillStyle = TX2;
      ctx.font = "600 " + Math.round(Math.min(W, H) * 0.055) + "px Inter, sans-serif";
      // подпись фазы уводим выше: при кегле 0.26 цифра доставала до неё
      ctx.fillText(P.n.toUpperCase(), cx, cy - Math.min(W, H) * 0.145);

      ctx.fillStyle = TXT;
      ctx.font = "600 " + Math.round(Math.min(W, H) * 0.24) + "px 'Cormorant Garamond', Georgia, serif";
      ctx.fillText(String(Math.max(1, Math.ceil(SEC - t))), cx, cy + Math.min(W, H) * 0.085);

      ctx.fillStyle = TX3;
      ctx.font = "400 " + Math.round(Math.min(W, H) * 0.040) + "px Inter, sans-serif";
      ctx.fillText(P.hint, cx, cy + Math.min(W, H) * 0.16);
    } else {
      ctx.fillStyle = TX2;
      ctx.font = "500 " + Math.round(Math.min(W, H) * 0.050) + "px Inter, sans-serif";
      ctx.fillText("Готовы — нажмите «Начать»", cx, cy - Math.min(W, H) * 0.02);
      ctx.fillStyle = TX3;
      ctx.font = "400 " + Math.round(Math.min(W, H) * 0.040) + "px Inter, sans-serif";
      ctx.fillText(SEC + " секунды на сторону", cx, cy + Math.min(W, H) * 0.06);
    }
    ctx.textAlign = "start";
  }

  const buzz = kind => {
    const tg = window.Telegram && window.Telegram.WebApp;
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); }catch(e){}
  };

  function frame(now){
    breathRAF = requestAnimationFrame(frame);
    if(!last) last = now;
    const dt = Math.min((now - last) / 1000, 0.1);   // вкладка была свёрнута — не прыгаем
    last = now;

    if(running){
      t += dt;
      if(t >= SEC){
        t -= SEC;
        phase = (phase + 1) % 4;
        // конец круга — считаем цикл и отмечаем сильнее
        if(phase === 0){ cycles++; if(cyc) cyc.textContent = cycles; buzz("medium"); }
        else buzz("light");
      }
    }
    draw();
  }

  function toggle(){
    running = !running;
    if(running){ last = 0; }
    else { phase = 0; t = 0; }
    if(btn) btn.textContent = running ? "Остановить" : "Начать";
    buzz("medium");
  }

  if(!fit()) return;
  if(btn) btn.addEventListener("click", toggle);
  const onResize = () => { fit(); };
  breathResize = onResize;
  window.addEventListener("resize", onResize);

  breathOff = () => {
    window.removeEventListener("resize", onResize);
    if(btn) btn.removeEventListener("click", toggle);
  };
  breathRAF = requestAnimationFrame(frame);
}

function setupGame(){
  const cv = document.getElementById("gcv");
  if(!cv || !cv.getContext) return;
  loadGameBg();
  const ctx = cv.getContext("2d");
  const elDist = document.getElementById("gdist");
  const elBest = document.getElementById("gbest");
  const css = (typeof getComputedStyle === "function")
    ? getComputedStyle(document.documentElement) : null;
  const V = (n, f) => { try{ return css.getPropertyValue(n).trim() || f; }catch(e){ return f; } };
  const GOLD = V("--gold","#B98A2E"), GOLD_LT = V("--gold-lt","#D0A445"),
        GOLD_DK = V("--gold-dk","#7E5C1E"), BG = V("--bg","#060B14"),
        SURF = V("--surf","#0C1422"), TXT = V("--txt","#EDF1F6");
  const LANE = [V("--lane-1","#EDF2F7"), V("--lane-2","#2E6FD4"), V("--lane-3","#CE4038")];

  // Рекорд храним в телефоне. Если браузер запрещает — играем без рекорда.
  let best = readBest();

  let W = 0, H = 0, dpr = 1;
  function fit(){
    const r = cv.getBoundingClientRect();
    if(!r.width) return false;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }

  // --- состояние ---
  const READY = 0, PLAY = 1, DEAD = 2;
  let state, y, vy, ropes, dist, t, shake;

  function reset(){
    state = READY; t = 0; shake = 0;
    y = H * 0.5; vy = 0; dist = 0;
    ropes = [];
    // первая дорожка не у самого носа, но и не через полминуты
    for(let i = 0; i < 3; i++) addRope(W * 0.9 + W * 0.58 * i);
    draw();
  }

  // Просвет сужается с расстоянием, но не бесконечно: ниже 0.20 высоты
  // проход становится делом удачи, а не умения.
  function gapFor(){ return H * Math.max(0.26, 0.44 - dist * 0.0012); }
  function speedFor(){ return W * (0.34 + Math.min(dist, 60) * 0.0030); }

  function addRope(x){
    const g = gapFor(), pad = H * 0.10;
    const lo = pad + g/2, hi = H - pad - g/2;
    let cy = lo + Math.random() * (hi - lo);
    // Соседние просветы не должны прыгать через весь экран: иначе попадаются
    // связки, которые физически не пройти, сколько ни греби.
    const prev = ropes.length ? ropes[ropes.length-1].cy : H/2;
    cy = Math.max(lo, Math.min(hi, Math.max(prev - H*0.26, Math.min(prev + H*0.26, cy))));
    ropes.push({ x, g, cy, passed:false });
  }

  function stroke(){
    if(state === READY){ state = PLAY; }
    else if(state === DEAD){ if(t > 0.6) reset(); return; }
    vy = -H * 0.58;   // короткий гребок: подъём примерно на восьмую часть высоты,
                      // зато высоту держать заметно проще
  }

  function die(){
    if(state !== PLAY) return;
    state = DEAD; t = 0; shake = 1;
    if(dist > best){
      best = dist;
      writeBest(best);
    }
    // Рекорд месяца растёт независимо: он может обновиться и тогда,
    // когда до общего рекорда заплыв не дотянул
    if(dist > readMonthBest()) writeMonthBest(dist);
    const tg = window.Telegram && window.Telegram.WebApp;
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error"); }catch(e){}
  }

  const R = () => H * 0.037;              // радиус пловца
  const ROPE_W = () => H * 0.034;         // толщина троса

  function step(dt){
    t += dt;
    if(shake > 0) shake = Math.max(0, shake - dt * 4);
    if(state !== PLAY) return;

    vy += H * 1.28 * dt;                   // тонет
    vy = Math.min(vy, H * 0.95);           // но не камнем
    y += vy * dt;

    const sp = speedFor(), r = R(), rw = ROPE_W();
    for(const p of ropes) p.x -= sp * dt;

    if(ropes.length && ropes[0].x < -rw*1.5){ ropes.shift(); addRope(ropes[ropes.length-1].x + W * 0.58); }

    const px = W * 0.28;
    for(const p of ropes){
      if(!p.passed && p.x + rw/2 < px - r){ p.passed = true; dist += 25; }
      // Столкновение считаем не по точке, а по отрезку, который трос прошёл
      // за кадр. Иначе на скорости он за один кадр перепрыгивает пловца
      // целиком, и удар не засчитывается.
      const was = p.x + sp * dt;
      const l = Math.min(p.x, was) - rw/2, rr = Math.max(p.x, was) + rw/2;
      if(l < px + r && rr > px - r){
        if(y - r < p.cy - p.g/2 || y + r > p.cy + p.g/2) die();
      }
    }
    if(y + r > H || y - r < 0) die();       // дно и поверхность
  }

  /* Фон — настоящий снимок бассейна, тот же, что на главной. Он медленно
     уезжает влево: если оставить его неподвижным, мозг замечает, что всё
     движется, а бассейн стоит. Плитки чередуем зеркально — у фотографии
     левый и правый края не совпадают, а зеркальная укладка сходится всегда. */
  function drawWater(sh){
    if(!bgImg){                                   // снимок ещё не загрузился
      const grd = ctx.createLinearGradient(0,0,0,H);
      grd.addColorStop(0, SURF); grd.addColorStop(1, BG);
      ctx.fillStyle = grd; ctx.fillRect(0,-Math.abs(sh),W,H+Math.abs(sh)*2);
      ctx.strokeStyle = "rgba(255,255,255,.045)"; ctx.lineWidth = 1;
      for(let i=0;i<7;i++){
        const yy = H*(0.09+i*0.13), off = (t*speedFor()*0.35 + i*90) % (W+120);
        ctx.beginPath();
        for(let x=-120;x<W+120;x+=14) ctx.lineTo(x, yy + Math.sin((x+off)/48)*3.5);
        ctx.stroke();
      }
      return;
    }
    const k = Math.max(W/bgImg.width, H/bgImg.height);
    const dw = bgImg.width*k, dh = bgImg.height*k, y0 = (H-dh)/2 - Math.abs(sh);
    const shift = t * speedFor() * 0.12;          // фон идёт много медленнее дорожек
    const first = Math.floor(shift/dw) - 1;
    for(let i = first; i*dw - shift < W; i++){
      const x = i*dw - shift;
      ctx.save();
      if((((i % 2) + 2) % 2) === 1){               // зеркальная плитка
        ctx.translate(x + dw, y0); ctx.scale(-1, 1);
        ctx.drawImage(bgImg, 0, 0, dw, dh + Math.abs(sh)*2);
      } else {
        ctx.drawImage(bgImg, x, y0, dw, dh + Math.abs(sh)*2);
      }
      ctx.restore();
    }
    // затемняем, иначе золотые тросы теряются на светлой воде
    ctx.fillStyle = "rgba(6,11,20,.58)";
    ctx.fillRect(0, -Math.abs(sh), W, H + Math.abs(sh)*2);
  }

  // --- рисование ---
  function draw(){
    const sh = shake ? (Math.random()-0.5) * H * 0.02 * shake : 0;
    ctx.save(); ctx.translate(0, sh);
    drawWater(sh);

    // дорожки
    const rw = ROPE_W();
    for(const p of ropes){
      drawRope(p.x, 0, p.cy - p.g/2, rw);
      drawRope(p.x, p.cy + p.g/2, H, rw);
    }

    drawSwimmer(W*0.28, y, R());
    ctx.restore();

    if(elDist) elDist.textContent = dist + " м";
    if(elBest) elBest.textContent = best ? "рекорд " + best + " м" : "";

    if(state === READY) banner("Касание — гребок", "Проведите пловца между дорожками");
    if(state === DEAD)  banner(dist + " м", dist >= best && dist > 0 ? "Новый рекорд. Касание — заново" : "Касание — заново");
  }

  /* Трос как в бассейне: цепочка поплавков, а не сплошная палка.
     Цвета идут по кругу бело-сине-красным. Порядок считаем от общей
     сетки, а не от начала куска, — иначе верхний и нижний отрезки
     одной дорожки начинались бы с разного цвета. */
  function drawRope(x, y0, y1, w){
    const r = w/2;
    ctx.save(); ctx.beginPath(); ctx.rect(x-r, y0, w, Math.max(0,y1-y0)); ctx.clip();
    const start = Math.floor((y0 - w) / w);
    for(let n = start; n * w < y1 + w; n++){
      const yy = n * w;
      ctx.beginPath(); ctx.arc(x, yy + r, r*0.96, 0, 6.284);
      ctx.fillStyle = LANE[((n % 3) + 3) % 3]; ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1;
    ctx.strokeRect(x-r, y0, w, Math.max(0,y1-y0));
  }

  /* Пловец — тот же силуэт, что у клуба: кроль в профиль, рука в проносе
     над головой, голова в шапочке лежит на воде, спина клином уходит назад.
     Рисуем в коробке 100×59 и вписываем её в размер пловца. */
  function swimmerPath(s){
    const P = (a,b) => [a*s/100, b*s/100];

    ctx.beginPath();                       // корпус: клин от хвоста к плечу
    ctx.moveTo(...P(0,57));
    ctx.quadraticCurveTo(...P(16,53), ...P(30,42));
    ctx.lineTo(...P(37,36));
    ctx.quadraticCurveTo(...P(45,47), ...P(54,59));
    ctx.lineTo(...P(1,59));
    ctx.closePath(); ctx.fill();

    ctx.save();                            // голова в шапочке, лежит на воде
    ctx.beginPath(); ctx.rect(0, 0, s, 59*s/100); ctx.clip();
    ctx.beginPath(); ctx.ellipse(63*s/100, 47*s/100, 19*s/100, 13*s/100, -0.10, 0, 6.284);
    ctx.fill(); ctx.restore();

    ctx.beginPath();                       // рука в проносе: массивная, иначе пропадёт
    ctx.moveTo(...P(34,36));
    ctx.bezierCurveTo(...P(36,12), ...P(47,0),  ...P(63,0));
    ctx.bezierCurveTo(...P(76,0),  ...P(86,3),  ...P(93,7));
    ctx.quadraticCurveTo(...P(100,10), ...P(97,14));
    ctx.quadraticCurveTo(...P(92,17), ...P(87,15));
    ctx.bezierCurveTo(...P(77,11), ...P(63,11), ...P(53,20));
    ctx.quadraticCurveTo(...P(46,26), ...P(43,40));
    ctx.closePath(); ctx.fill();
  }

  function drawSwimmer(x, y, r){
    const tilt = Math.max(-0.34, Math.min(0.34, vy / (H*1.6)));
    const s = r * 4.2;                     // длина фигуры относительно радиуса удара
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);

    ctx.save();                            // тень под пловцом — отрывает его от воды
    ctx.translate(-s/2, -s*0.59/2 + r*0.20);
    ctx.fillStyle = "rgba(0,0,0,.22)"; swimmerPath(s);
    ctx.restore();

    ctx.translate(-s/2, -s*0.59/2);
    const g = ctx.createLinearGradient(0, 0, 0, s*0.59);
    g.addColorStop(0, GOLD_LT); g.addColorStop(1, GOLD);
    ctx.fillStyle = g; swimmerPath(s);
    ctx.restore();

    // пузырьки за спиной: дают ощущение хода, а не висения в воде
    ctx.fillStyle = "rgba(255,255,255,.20)";
    for(let i = 0; i < 4; i++){
      const k = (t*2.2 + i*0.25) % 1;
      ctx.beginPath();
      ctx.arc(x - r*1.9 - k*r*3.4, y + Math.sin(t*6 + i)*r*0.5, r*0.20*(1-k), 0, 6.284);
      ctx.fill();
    }
  }

  // Подсказку держим в верхней трети: посередине она ложится прямо
  // на пловца, и в самый нужный момент его не видно.
  function banner(big, small){
    ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, H*0.13, W, H*0.26);
    ctx.textAlign = "center"; ctx.fillStyle = TXT;
    ctx.font = "600 " + Math.round(H*0.075) + "px 'Cormorant Garamond',Georgia,serif";
    ctx.fillText(big, W/2, H*0.235);
    ctx.fillStyle = GOLD;
    ctx.font = "500 " + Math.round(H*0.033) + "px Inter,sans-serif";
    ctx.fillText(small, W/2, H*0.315);
  }

  // --- цикл ---
  let last = 0;
  function loop(ts){
    if(!last) last = ts;
    const dt = Math.min((ts - last)/1000, 0.05);   // после сворачивания не прыгаем
    last = ts;
    step(dt); draw();
    gameRAF = requestAnimationFrame(loop);
  }

  // --- управление ---
  const onTap = e => { e.preventDefault(); stroke(); };
  const onKey = e => { if(e.code === "Space" || e.key === " "){ e.preventDefault(); stroke(); } };
  /* Размер окна на телефоне меняется всё время: прячется адресная строка,
     разворачивается телеграм, поворачивается экран. Раньше на каждое такое
     событие заплыв начинался заново — прямо посреди рекорда. Теперь просто
     пересчитываем всё под новый размер и плывём дальше. */
  const onResize = () => {
    const oldW = W, oldH = H;
    if(!fit()) return;
    if(!oldW || !oldH || state === READY){ reset(); return; }
    const kx = W / oldW, ky = H / oldH;
    y *= ky; vy *= ky;
    for(const p of ropes){ p.x *= kx; p.cy *= ky; p.g *= ky; }
  };
  gameResize = onResize;                  // телеграм сообщает о смене окна отдельно

  cv.addEventListener("pointerdown", onTap, {passive:false});
  window.addEventListener("keydown", onKey);
  window.addEventListener("resize", onResize);
  gameOff = () => {
    cv.removeEventListener("pointerdown", onTap);
    window.removeEventListener("keydown", onKey);
    window.removeEventListener("resize", onResize);
    gameResize = null;
  };

  if(!fit()){ requestAnimationFrame(()=>{ if(fit()){ reset(); gameRAF = requestAnimationFrame(loop); } }); return; }
  reset();
  gameRAF = requestAnimationFrame(loop);
}

let vidObserver = null;
let frameObserver = null;

/* Плееры Kinescope грузим только когда до них доскроллили.
   autoplay=1&muted=1 — запуск без звука, звук включается кнопкой
   в самом плеере. autopause=1 — плеер сам ставится на паузу,
   если на странице запустился другой. */
function setupFrames(){
  const frames = Array.from(document.querySelectorAll(".vid iframe[data-src]"));
  if(!frames.length) return;

  if(frameObserver) frameObserver.disconnect();

  frameObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const f = en.target;
      f.src = f.dataset.src;
      f.removeAttribute("data-src");
      frameObserver.unobserve(f);
    });
  }, {threshold: 0.25});

  frames.forEach(f=>frameObserver.observe(f));
}

function setupVideos(){
  setupFrames();

  const vids = Array.from(document.querySelectorAll(".vid video"));
  if(!vids.length) return;

  if(vidObserver) vidObserver.disconnect();

  vidObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const v = en.target;
      if(en.isIntersecting){ v.play().catch(()=>{}); }
      else {
        v.pause();
        if(!v.muted){ v.muted = true; v.controls = false; v.closest(".vid").classList.remove("on"); }
      }
    });
  }, {threshold: 0.5});

  vids.forEach(v=>{
    /* Локального файла нет (например, папку с видео уже убрали
       из репозитория, а ID Kinescope ещё не вписан) — вместо
       чёрного прямоугольника показываем аккуратную заглушку. */
    v.addEventListener("error", ()=>{
      const box = v.closest(".vid");
      if(!box) return;
      const snd = box.querySelector(".snd");
      if(snd) snd.remove();
      const ph = document.createElement("div");
      ph.className = "vid-ph";
      ph.innerHTML = "<b>&#9654; Видео скоро появится</b>Ролик готовится к публикации";
      v.replaceWith(ph);
    });
    vidObserver.observe(v);
    v.addEventListener("click", ()=>{
      const box = v.closest(".vid");
      if(v.muted){
        vids.forEach(o=>{
          if(o !== v && !o.muted){
            o.muted = true; o.controls = false;
            o.closest(".vid").classList.remove("on");
          }
        });
        v.muted = false;
        v.controls = true;
        box.classList.add("on");
        v.play().catch(()=>{});
      } else {
        v.muted = true;
        v.controls = false;
        box.classList.remove("on");
      }
    });
  });
}

function go(id){ location.hash = id; }
window.addEventListener("hashchange", ()=> render(location.hash.slice(1) || "home"));
loadLevel();                       // из памяти устройства — мгновенно
render(location.hash.slice(1) || "home");

/* Над мини-приложением телеграм рисует собственную полосу и красит её
   в цвет своей темы — у большинства он чёрный. Поэтому поверх синей
   страницы висит чужая чёрная шапка. Просим телеграм взять наш цвет.
   Значение берём из палитры, а не пишем руками: иначе при следующей
   смене фона полоса снова отвяжется от страницы. */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(!tg || typeof getComputedStyle !== "function") return;
  let bg = "";
  try{ bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); }catch(e){}
  if(!bg) return;
  const ver = v => tg.isVersionAtLeast && tg.isVersionAtLeast(v);
  try{
    tg.ready();
    tg.expand();                                    // на весь экран, без полупозиции
    if(tg.setBackgroundColor) tg.setBackgroundColor(bg);
    if(tg.setHeaderColor){
      /* Произвольный цвет шапки телеграм понимает начиная с версии 6.9;
         в старых клиентах просим взять цвет фона темы, это всё же ближе.
         На новых клиентах цвет ставит paintTab: у каждой вкладки он свой,
         и одного значения на всё приложение уже не хватает. Скрипт
         телеграма грузится позже первой отрисовки, поэтому красим
         повторно — иначе шапка осталась бы от цвета по умолчанию. */
      if(ver("6.9")) paintTab(tabOf(location.hash.slice(1) || "home"));
      else tg.setHeaderColor("bg_color");
    }

    /* Уровень подготовки лежит в облаке телеграма, а не на телефоне:
       так он переезжает вместе с человеком. Ответ приходит с задержкой,
       поэтому экран уже нарисован по памяти устройства, а здесь мы его
       при необходимости перерисуем. */
    syncLevel();

    // Смахивание вниз внутри приложения сворачивает его. На заплыве это
    // просто беда: тянешь пловца вверх — приложение закрывается.
    if(ver("7.7") && tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    /* Высота окна. В телеграме 100vh — это высота экрана, а не видимой
       части приложения: сверху его собственная полоса, снизу иногда
       клавиатура. Отдаём в стили настоящую высоту и следим за её сменой. */
    const setVH = () => {
      const h = tg.viewportStableHeight || tg.viewportHeight;
      if(!h) return;
      document.documentElement.style.setProperty("--vh", h + "px");
      // холст меряется в пикселях, поэтому после смены высоты его надо
      // пересчитать: иначе картинка растянется, а игра этого не заметит
      if(gameResize) gameResize();
    };
    setVH();
    if(tg.onEvent) tg.onEvent("viewportChanged", setVH);
  }catch(e){}
})();
</script>
