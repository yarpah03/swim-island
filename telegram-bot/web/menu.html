<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08191f">
<title>Плавательный остров — меню</title>
<link rel="stylesheet" href="/v1/client/entry/menu.css">
<script src="/v1/client/entry/telegram-web-app.js" defer></script>
<script src="/v1/client/entry/menu.js" defer></script>
</head>
<body>
<main>
<header class="brand"><img src="/v1/client/entry/media/avatar-entry-v2.jpg" alt="Плавательный остров VIP — Старт" width="48" height="48"><div><span>ПЛАВАТЕЛЬНЫЙ ОСТРОВ <b>VIP</b></span><small>Материалы, практика и сообщество</small></div><span class="brand-wave" aria-hidden="true">≈</span></header>
<div class="eyebrow">ВАШ СЛЕДУЮЩИЙ ШАГ</div>
<h1>С чего начнём<span>?</span></h1>
<p class="intro">Выберите раздел — он откроется в чате бота.</p>
<div class="grid" aria-label="Разделы бота">
<button class="tile" data-action="materials"><img src="/v1/client/entry/media/thumb-materials.jpg" alt="" loading="eager"><span class="tile-body"><small>НАЧНИТЕ ЗДЕСЬ</small><strong>Полезные материалы</strong><span>PDF, уроки и чек-листы</span><b aria-hidden="true">↗</b></span></button>
<button class="tile" data-action="about"><img src="/v1/client/entry/media/thumb-about.jpg" alt="" loading="eager"><span class="tile-body"><small>НАШ КЛУБ</small><strong>Что внутри VIP</strong><span>Приложение и сообщество</span><b aria-hidden="true">↗</b></span></button>
<button class="tile" data-action="tariffs"><img src="/v1/client/entry/media/thumb-tariffs.jpg" alt="" loading="lazy"><span class="tile-body"><small>ВЫБЕРИТЕ СВОЙ</small><strong>Тарифы</strong><span>Сроки и условия подписки</span><b aria-hidden="true">↗</b></span></button>
<button class="tile" data-action="access"><img src="/v1/client/entry/media/thumb-access.jpg" alt="" loading="lazy"><span class="tile-body"><small>ВАШ АККАУНТ</small><strong>Войти в приложение</strong><span>Telegram или сайт</span><b aria-hidden="true">↗</b></span></button>
<button class="tile" data-action="news"><img src="/v1/client/entry/media/thumb-news.jpg" alt="" loading="lazy"><span class="tile-body"><small>НА СВЯЗИ</small><strong>Новости острова</strong><span>Обновления и эфиры</span><b aria-hidden="true">↗</b></span></button>
<button class="tile" data-action="help"><img src="/v1/client/entry/media/thumb-help.jpg" alt="" loading="lazy"><span class="tile-body"><small>МЫ РЯДОМ</small><strong>Помощь</strong><span>Вопросы и поддержка</span><b aria-hidden="true">↗</b></span></button>
</div>
<button class="join" data-action="buy"><span>Присоединиться к VIP</span><b aria-hidden="true">↗</b></button>
<button id="admin" class="admin" data-action="admin" hidden><span>Управление ботом</span><b aria-hidden="true">↗</b></button>
<p id="status" class="status" role="status" aria-live="polite"></p>
<footer>Ярослав Пахомов &amp; Макар Марченко<br><span>Плавайте в своём ритме.</span></footer>
</main>
</body>
</html>
